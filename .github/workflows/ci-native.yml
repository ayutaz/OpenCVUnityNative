name: ci-native

# push は main のみ。ブランチへの push では走らせない。
#
# concurrency だけでは重複は消せない — あれは後発が先発を打ち切る仕組みで、
# 2 本起動すること自体は止まらないからである。作業ブランチでは pull_request が
# 拾うので、push 側を main に絞れば「同じコミットに 2 本」が構造的に無くなる。
#
# main への push（squash merge の着地）は PR を伴わないので、明示的に残す。
# これが必須チェックの記録を main 上に残す唯一の経路である。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 同じコミットに対して push と pull_request の両方が走らないようにする。
#
# 以前は group に github.ref を使っていたが、これは push ではブランチ名
# （refs/heads/foo）、pull_request では PR の参照（refs/pull/N/merge）になるため、
# **同じコミットでも別グループと見なされて重複排除が効かなかった**。実測: 2026-08-27 に
# 6cfc31d へ 37 秒差で 2 本走り、後発が資源の奪い合いで落ちた（先発は成功）。
#
# head_ref は pull_request のときだけソースブランチ名になり、push では空になる。
# ref との組み合わせで、PR がある間は PR 側の 1 本に寄る。
concurrency:
  group: ci-native-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (L1 + L3)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache CMake FetchContent (googletest)
        uses: actions/cache@v6
        with:
          path: build/windows-x64-debug/_deps
          key: fetchcontent-windows-${{ hashFiles('native/tests/CMakeLists.txt') }}

      # third_party/opencv/<hash> をハッシュ単位でキャッシュする。ヒットすれば
      # restore は gh からの download をスキップし、既存の木を検証するだけで
      # 済む（tools/opencv.ps1 の Invoke-Restore を参照）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      # ローカルと同一のコマンドを呼ぶ。CI 専用の手順を作らない。
      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore

      - name: Run all fast lanes
        shell: pwsh
        run: ./tools/dev.ps1 test

      # ローカルループから外した重いツールテスト。ここが唯一の実行場所なので、
      # 落とすと構成ハッシュと allowlist 検証の回帰テストが誰にも見られなくなる。
      # VerifyOpenCvArtifact はケースごとに pwsh を起動するため単体で 1 分規模、
      # OpenCvRestore は実際に artifact を download する（tools/dev.ps1 の
      # $ToolsTestScriptsSlow の注記を参照）。
      - name: Run the slow tools tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/dev.ps1 test-tools-slow

      # L3 が本当にクラッシュ・ハング耐性を持つかを実証する probe。数分かかるため
      # ローカルの test には含めず、ここが唯一の実行場所になる
      # (tools/run-managed-probe.ps1 / CLAUDE.md の L3 の節を参照)。
      - name: Run the L3 crash and hang probes
        shell: pwsh
        run: ./tools/dev.ps1 test-managed-probe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: artifacts/test-results/
          if-no-files-found: warn

  macos:
    name: macOS arm64 (L1 + L3)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install Ninja
        run: brew install ninja

      # **OpenCV は毎回 API から取らない。** restore は木が既に在れば
      # download を丸ごと省く（Invoke-Restore の先頭で検証して return する）。
      #
      # キャッシュが無いと、この job が走るたびに artifact を探す API 呼び出しが
      # 発生する。**多数の workflow を同時に走らせるとレート制限に当たり、
      # 成果物にもコードにも問題が無いのに CI が全部赤くなる**（実測、
      # 2026-08-29。Dependabot の PR 9 件と v0.1.1 のリリースが同時に落ちた）。
      #
      # その対策で codeql / nightly / ci-unity / release には入れたのに、
      # **必須チェックであるこの job には入れ忘れていた。** 検査
      # （tools/tests/OpenCvConfig.Tests.ps1）が workflow 単位で「cache が
      # 1 つでもあるか」しか見ておらず、windows job の分で通っていたためである。
      #
      # -Platform を渡さないのは、この job が対象 platform の上で走っている
      # からである（Get-OpenCvPlatform が $IsMacOS と OSArchitecture から
      # macos-arm64 と判定する）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore
      - name: Run all fast lanes
        shell: pwsh
        run: ./tools/dev.ps1 test

      # Task 5 が足した macOS / Linux の linkage 検証は、このレーンからしか
      # 呼ばれない。ここに無いと「書かれているがどこからも走らない検査」に
      # なる（M1 の H2 で同じ形を指摘済み）。
      - name: Run the slow tools tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/dev.ps1 test-tools-slow

      # **落ちたときに読めることが目的なので if: always() を付ける。**
      # 成功時だけ上げても意味が無い（M0 の完了条件「テスト結果を機械可読な
      # 形式で artifact 化し、失敗時に読める状態にする」）。windows job には
      # 最初から在ったが、M3 で足したこの job には無かった。
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: artifacts/test-results/
          if-no-files-found: warn

  linux:
    name: Linux x64 (L1 + L3)
    runs-on: ubuntu-24.04
    # Linux はコンテナの中でビルドする。**runner のイメージで直接ビルドしない。**
    #
    # 共有ライブラリはビルドした環境と同じかそれより新しい glibc でしか
    # 読み込めない。runner のイメージは GitHub の都合で上がっていくので、
    # 上がるたびに成果物の要求が上がる。v0.1.0 で実際に踏んだ（ubuntu-24.04 で
    # 作った .so が GLIBC_2.38 を要求し、より古い環境で DllNotFoundException）。
    #
    # イメージ名の正本は tools/opencv-config.psd1 の
    # Toolchains['linux-x64'].Container で、その値は構成ハッシュに入る。
    # ここと食い違うと tools/tests/OpenCvConfig.Tests.ps1 が落ちる。
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      # **git だけを checkout より前に入れる。**
      #
      # checkout は git が無いと REST API でアーカイブを落とす形に落ち、
      # .git の無いツリーになる。すると `git ls-files` を使うテストが
      # 「追跡ファイル 0 件」で通ってしまう——検査が黙って無力化される形である。
      #
      # 残りの道具は checkout の**後**に setup-linux-container.sh が入れる。
      # そのスクリプト自体がリポジトリの中にあるので、順序はこうなる
      # （最初はスクリプトを checkout 前に置いてしまい、`not found` で落ちた）。
      - name: Install git before checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - name: Set up the build container
        run: bash ./tools/ci/setup-linux-container.sh
      # .NET と Ninja は setup-linux-container.sh が入れる。

      # **OpenCV は毎回 API から取らない。** restore は木が既に在れば
      # download を丸ごと省く（Invoke-Restore の先頭で検証して return する）。
      #
      # キャッシュが無いと、この job が走るたびに artifact を探す API 呼び出しが
      # 発生する。**多数の workflow を同時に走らせるとレート制限に当たり、
      # 成果物にもコードにも問題が無いのに CI が全部赤くなる**（実測、
      # 2026-08-29。Dependabot の PR 9 件と v0.1.1 のリリースが同時に落ちた）。
      #
      # **位置は「コンテナの用意」より後でなければならない。** この step は
      # pwsh で走るが、その pwsh を入れるのは setup-linux-container.sh である。
      # ワークスペースはコンテナに mount されているので、ここで展開した木は
      # そのままビルドから見える（nightly.yml の同じ job と同じ形）。
      #
      # -Platform を渡さないのは、この job が対象 platform の上で走っている
      # からである（Get-OpenCvPlatform が $IsLinux と OSArchitecture から
      # linux-x64 と判定する。コンテナが ubuntu:22.04 でも判定は変わらない）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore
      - name: Run all fast lanes
        shell: pwsh
        run: ./tools/dev.ps1 test

      # Task 5 が足した macOS / Linux の linkage 検証は、このレーンからしか
      # 呼ばれない。ここに無いと「書かれているがどこからも走らない検査」に
      # なる（M1 の H2 で同じ形を指摘済み）。
      - name: Run the slow tools tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/dev.ps1 test-tools-slow

      # **落ちたときに読めることが目的なので if: always() を付ける。**
      # 成功時だけ上げても意味が無い（M0 の完了条件「テスト結果を機械可読な
      # 形式で artifact 化し、失敗時に読める状態にする」）。windows job には
      # 最初から在ったが、M3 で足したこの job には無かった。
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: artifacts/test-results/
          if-no-files-found: warn

  # --- モバイルのクロスビルド（M4）---
  #
  # **L1 / L3 は走らせない。** クロスビルドした GoogleTest は host で実行できず、
  # P/Invoke も host からは呼べない。ここが確かめるのは「クロスビルドが通ること」
  # と「配る形になっていること」までである。**実機での検証は
  # docs/m4-device-verification.md が人に渡す** —— CI が代われない部分がある、
  # というのがこの job の前提である。
  mobile:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read   # opencv.ps1 restore が gh run download を呼ぶ

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-arm64
            name: Android arm64-v8a (cross-build)
            runner: ubuntu-24.04
          - platform: ios-arm64
            name: iOS arm64 (cross-build)
            runner: macos-14
          # Web / Wasm も**クロスコンパイルかつ静的ライブラリ**。
          # **L1 は走らない**（クロスした GoogleTest を host で実行できない）。
          # このレーンが見るのは「ビルドできる」と「束ねられている」だけである。
          - platform: web-wasm
            name: Web wasm32 (cross-build)
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi

      # **Emscripten は emsdk から入れる。版は対応表から読む。**
      # workflow に数字を直書きしない（tools/tests/EmscriptenVersion.Tests.ps1 が
      # 「リテラルが書かれていないこと」を見ている）。
      - name: Resolve the Emscripten version from the table
        if: matrix.platform == 'web-wasm'
        id: emver
        shell: pwsh
        run: |
          $table = Import-PowerShellDataFile ./tools/emscripten-versions.psd1
          $pv = Get-Content ./tests/UnityProject/ProjectSettings/ProjectVersion.txt -Raw
          $unity = ([regex]::Match($pv, 'm_EditorVersion:\s*(?<v>\S+)')).Groups['v'].Value
          $minor = ($unity -split '\.')[0..1] -join '.'
          if (-not $table.ContainsKey($minor)) { throw "Unity $minor の項が対応表にありません。" }
          "version=$($table[$minor].Emscripten)" >> $env:GITHUB_OUTPUT

      - name: Set up Emscripten
        if: matrix.platform == 'web-wasm'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emver.outputs.version }}

      - name: Point the build at the emsdk toolchain
        if: matrix.platform == 'web-wasm'
        shell: bash
        run: echo "OCVU_EMSCRIPTEN_ROOT=$EMSDK/upstream" >> "$GITHUB_ENV"

      # cache が無いと job のたびに artifact を探す API 呼び出しが起きる。
      # **レート制限に当たると、成果物にもコードにも問題が無いのに CI が
      # 全部赤くなる**（実測、2026-08-29）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig -Platform '${{ matrix.platform }}')
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore -Platform ${{ matrix.platform }}

      - name: Build the native plugin
        shell: pwsh
        run: ./tools/dev.ps1 build -Platform ${{ matrix.platform }}

      # **配る形になっていること。** Android は 16 KB page size、iOS は
      # 静的ライブラリであること。どちらも「ビルドできた ≠ 動く」の距離を
      # 少しだけ詰める検査で、実機の代わりにはならない。
      - name: Verify the shipped form
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          if ($platform -eq 'web-wasm') {
              $lib = 'Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins/WebGL/libopencv_unity_native.a'
              # **束ねられていることを見る。** iOS で同じ検査が 2 本とも
              # 空振りしていたので、こちらは script に出して壊して確かめてある。
              ./tools/verify-static-bundle.ps1 -Path $lib -NmCommand "$env:EMSDK/upstream/bin/llvm-nm"
              if ($LASTEXITCODE -ne 0) { exit 1 }
              # **SIMD が効いていることを、送った flag ではなく出来た物で見る。**
              ./tools/verify-wasm-features.ps1 -Path $lib
              if ($LASTEXITCODE -ne 0) { exit 1 }
          } elseif ($platform -eq 'android-arm64') {
              ./tools/verify-android-page-size.ps1
              if ($LASTEXITCODE -ne 0) { exit 1 }
          } elseif ($platform -eq 'ios-arm64') {
              $lib = 'Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins/iOS/libopencv_unity_native.a'
              if (-not (Test-Path -LiteralPath $lib)) {
                  Write-Error "iOS の静的ライブラリがありません: $lib"
                  exit 1
              }
              # **ar のアーカイブであること。** 共有ライブラリになっていたら
              # iOS では読み込めない —— しかもビルドは成功するので、
              # Unity に入れて初めて壊れる。
              # **全部は読まない。** 16.8 MB の .a に対して ReadAllBytes を
              # 呼ぶと丸ごとメモリに載せる。要るのは先頭 8 バイトである。
              $headBytes = [byte[]]::new(8)
              $fs = [IO.File]::OpenRead($lib)
              try { $read = $fs.Read($headBytes, 0, 8) } finally { $fs.Dispose() }
              if ($read -ne 8) { Write-Error "$lib が 8 バイト未満です"; exit 1 }
              $head = [System.Text.Encoding]::ASCII.GetString($headBytes)
              if ($head -ne '!<arch>' + [char]0x0A) {
                  Write-Error "静的ライブラリではありません（先頭が '!<arch>' ではない）: $lib"
                  exit 1
              }
              Write-Host "==> $lib is an ar archive"

              <#
                  **形だけでは足りない。中身に OpenCV が入っていることを見る。**

                  CMake は STATIC ライブラリに依存アーカイブを取り込まないので、
                  何もしなければ出来る .a は自分の object だけになり、cv::cvtColor
                  などは未解決のまま残る。**Unity が Xcode でリンクした時点で初めて
                  失敗する** —— ビルドも CI もそこまで緑である。

                  **前の 2 つの判定はどちらも空振りしていた**（M4 のレビューで発見）:

                    - `ar t` のメンバ名を /opencv/ で照合していたが、424 member のうち
                      当たっていたのは 1 件だけで、しかもそれは OpenCV ではなく
                      **こちらの ocvu_opencv_info.cpp.o** だった。OpenCV の object は
                      alloc.cpp.o / png.c.o のように名前に opencv を含まない。
                      **libtool が 1 バイトも束ねなくても緑になる。**
                    - `nm -u | match cv::` は、nm が既定で demangle しないので
                      **決して真にならない**（実物には _ZN2cv が 156 件、cv:: は 0 件）。
                      しかも 2>$null で nm の失敗ごと握り潰していた。

                  **いまは測りたいものを直接測る**: 「こちらの object が要求している
                  cv:: のシンボルを、この archive が定義しているか」。これは Xcode が
                  リンクするときに問う質問そのものである。

                  マングル名を書き並べない —— 必要なシンボルの一覧は、こちらの object
                  だけを詰めた archive の未定義シンボルとして**その場で得る**。
                  OpenCV の名前空間の綴りや inline namespace の有無に依存しない。
              #>
              # **nm のフラグに頼らない。** --defined-only / -U の意味は実装で割れるので、
              # -g（外部シンボルのみ）だけを使い、型の欄を自分で読む。
              # archive では 'name.a(member.o):' の見出し行が混ざるので、
              # 「アドレス? 型 1 文字 名前」の形に当たる行だけを拾う。
              function Get-NmSymbols {
                  param([string] $Archive, [switch] $UndefinedOnly)
                  $out = & nm -g $Archive 2>&1
                  if ($LASTEXITCODE -ne 0) {
                      throw "nm -g が失敗しました ($Archive): $($out -join ' ')"
                  }
                  $syms = [System.Collections.Generic.List[string]]::new()
                  foreach ($line in $out) {
                      if ($line -notmatch '^\s*([0-9a-fA-F]+)?\s*([A-Za-z])\s+(\S+)\s*$') { continue }
                      $isUndefined = ($Matches[2] -ceq 'U')
                      if ($UndefinedOnly -ne $isUndefined) { continue }
                      $syms.Add($Matches[3])
                  }
                  return @($syms)
              }

              $members = & ar t $lib
              if ($LASTEXITCODE -ne 0) { Write-Error "ar t が失敗しました: $lib"; exit 1 }

              # --- こちらの object だけを詰めた archive を作る（必要シンボルの供給源であり、
              #     同時に「判定が空振りしていないか」の負の対照でもある）---
              $ourObjects = @($members | Where-Object { $_ -match '^ocvu_.*\.o$' })
              if ($ourObjects.Count -lt 1) {
                  Write-Error "自分の object が 1 つも見つかりません: $($members.Count) members"
                  exit 1
              }
              $libFull = (Resolve-Path -LiteralPath $lib).Path
              $probeDir = Join-Path $(if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { [IO.Path]::GetTempPath() }) 'ocvu-nobundle'
              Remove-Item -Recurse -Force $probeDir -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
              Push-Location $probeDir
              try {
                  & ar x $libFull @ourObjects
                  if ($LASTEXITCODE -ne 0) { throw 'ar x が失敗しました' }
                  & ar rcs 'nobundle.a' @ourObjects
                  if ($LASTEXITCODE -ne 0) { throw 'ar rcs が失敗しました' }
                  $needed = @(Get-NmSymbols -Archive 'nobundle.a' -UndefinedOnly |
                              Where-Object { $_ -like '*_ZN2cv*' -or $_ -like '*_ZNK2cv*' } |
                              Sort-Object -Unique)
              }
              finally { Pop-Location }

              # **必要シンボルが 0 件なら、この判定は何も見ていない。**
              if ($needed.Count -lt 1) {
                  Write-Error '自分の object が cv:: のシンボルを 1 つも要求していません。判定が成立しないので止めます。'
                  exit 1
              }
              Write-Host "==> our objects need $($needed.Count) cv:: symbols"

              $defined = @(Get-NmSymbols -Archive $lib | Sort-Object -Unique)
              $definedSet = [System.Collections.Generic.HashSet[string]]::new([string[]]$defined)
              $unresolved = @($needed | Where-Object { -not $definedSet.Contains($_) })

              if ($unresolved.Count -gt 0) {
                  # **here-string を使わない。** 終端の "@ は列 0 に置く必要があり、
                  # YAML のブロックスカラーの中では構造を壊す（実測）。
                  $msg = @(
                      ".a が自分の object の要求する cv:: シンボルを定義していません: $lib"
                      "未解決 $($unresolved.Count) / $($needed.Count) 件（先頭 5 件）:"
                      (($unresolved | Select-Object -First 5) -join [Environment]::NewLine)
                      'CMake は STATIC ライブラリに依存アーカイブを取り込みません。'
                      'このまま配ると、Unity が Xcode でリンクした時点で未解決シンボルになります。'
                  ) -join [Environment]::NewLine
                  Write-Error $msg
                  exit 1
              }
              Write-Host "==> all $($needed.Count) cv:: symbols are defined in the archive ($($members.Count) members)"

              # **番人が働くことを、同じ step で見せる。** 束ねていない archive
              # （いま作った nobundle.a）は、同じ判定で必ず落ちなければならない。
              # 落ちなければ判定が緩んでいる。壊さずに、毎回それを確かめる。
              Push-Location $probeDir
              try { $controlDefined = @(Get-NmSymbols -Archive 'nobundle.a') }
              finally { Pop-Location }
              $controlSet = [System.Collections.Generic.HashSet[string]]::new([string[]]$controlDefined)
              $controlUnresolved = @($needed | Where-Object { -not $controlSet.Contains($_) })
              if ($controlUnresolved.Count -lt 1) {
                  Write-Error '負の対照（束ねていない archive）を判定が通しました。この判定は束ねの有無を測れていません。'
                  exit 1
              }
              Write-Host "==> the same check rejects an unbundled archive ($($controlUnresolved.Count) of $($needed.Count) unresolved there)"
          } else {
              Write-Error "unknown platform '${platform}': 配る形をどう検査するか決まっていない。"
              exit 1
          }

      - name: Upload the plugin tree
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.platform }}
          path: Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins
          if-no-files-found: error
          retention-days: 1
