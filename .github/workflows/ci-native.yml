name: ci-native

# push は main のみ。ブランチへの push では走らせない。
#
# concurrency だけでは重複は消せない — あれは後発が先発を打ち切る仕組みで、
# 2 本起動すること自体は止まらないからである。作業ブランチでは pull_request が
# 拾うので、push 側を main に絞れば「同じコミットに 2 本」が構造的に無くなる。
#
# main への push（squash merge の着地）は PR を伴わないので、明示的に残す。
# これが必須チェックの記録を main 上に残す唯一の経路である。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# 同じコミットに対して push と pull_request の両方が走らないようにする。
#
# 以前は group に github.ref を使っていたが、これは push ではブランチ名
# （refs/heads/foo）、pull_request では PR の参照（refs/pull/N/merge）になるため、
# **同じコミットでも別グループと見なされて重複排除が効かなかった**。実測: 2026-08-27 に
# 6cfc31d へ 37 秒差で 2 本走り、後発が資源の奪い合いで落ちた（先発は成功）。
#
# head_ref は pull_request のときだけソースブランチ名になり、push では空になる。
# ref との組み合わせで、PR がある間は PR 側の 1 本に寄る。
concurrency:
  group: ci-native-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (L1 + L3)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache CMake FetchContent (googletest)
        uses: actions/cache@v4
        with:
          path: build/windows-x64-debug/_deps
          key: fetchcontent-windows-${{ hashFiles('native/tests/CMakeLists.txt') }}

      # third_party/opencv/<hash> をハッシュ単位でキャッシュする。ヒットすれば
      # restore は gh からの download をスキップし、既存の木を検証するだけで
      # 済む（tools/opencv.ps1 の Invoke-Restore を参照）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      # ローカルと同一のコマンドを呼ぶ。CI 専用の手順を作らない。
      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore

      - name: Run all fast lanes
        shell: pwsh
        run: ./tools/dev.ps1 test

      # ローカルループから外した重いツールテスト。ここが唯一の実行場所なので、
      # 落とすと構成ハッシュと allowlist 検証の回帰テストが誰にも見られなくなる。
      # VerifyOpenCvArtifact はケースごとに pwsh を起動するため単体で 1 分規模、
      # OpenCvRestore は実際に artifact を download する（tools/dev.ps1 の
      # $ToolsTestScriptsSlow の注記を参照）。
      - name: Run the slow tools tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/dev.ps1 test-tools-slow

      # L3 が本当にクラッシュ・ハング耐性を持つかを実証する probe。数分かかるため
      # ローカルの test には含めず、ここが唯一の実行場所になる
      # (tools/run-managed-probe.ps1 / CLAUDE.md の L3 の節を参照)。
      - name: Run the L3 crash and hang probes
        shell: pwsh
        run: ./tools/dev.ps1 test-managed-probe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: artifacts/test-results/
          if-no-files-found: warn

  macos:
    name: macOS arm64 (L1 + L3)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Ninja
        run: brew install ninja
      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore
      - name: Run all fast lanes
        shell: pwsh
        run: ./tools/dev.ps1 test

      # Task 5 が足した macOS / Linux の linkage 検証は、このレーンからしか
      # 呼ばれない。ここに無いと「書かれているがどこからも走らない検査」に
      # なる（M1 の H2 で同じ形を指摘済み）。
      - name: Run the slow tools tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/dev.ps1 test-tools-slow

  linux:
    name: Linux x64 (L1 + L3)
    runs-on: ubuntu-24.04
    # Linux はコンテナの中でビルドする。**runner のイメージで直接ビルドしない。**
    #
    # 共有ライブラリはビルドした環境と同じかそれより新しい glibc でしか
    # 読み込めない。runner のイメージは GitHub の都合で上がっていくので、
    # 上がるたびに成果物の要求が上がる。v0.1.0 で実際に踏んだ（ubuntu-24.04 で
    # 作った .so が GLIBC_2.38 を要求し、より古い環境で DllNotFoundException）。
    #
    # イメージ名の正本は tools/opencv-config.psd1 の
    # Toolchains['linux-x64'].Container で、その値は構成ハッシュに入る。
    # ここと食い違うと tools/tests/OpenCvConfig.Tests.ps1 が落ちる。
    container: ubuntu:22.04
    timeout-minutes: 30
    steps:
      # **checkout より前に置く。** git が無いと actions/checkout は REST API
      # でアーカイブを落とす形に落ち、.git の無いツリーになる。すると
      # `git ls-files` を使うテストが「追跡ファイル 0 件」で通ってしまう。
      - name: Set up the build container
        run: ./tools/ci/setup-linux-container.sh
      - uses: actions/checkout@v4
      # .NET と Ninja は setup-linux-container.sh が入れる。
      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore
      - name: Run all fast lanes
        shell: pwsh
        run: ./tools/dev.ps1 test

      # Task 5 が足した macOS / Linux の linkage 検証は、このレーンからしか
      # 呼ばれない。ここに無いと「書かれているがどこからも走らない検査」に
      # なる（M1 の H2 で同じ形を指摘済み）。
      - name: Run the slow tools tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/dev.ps1 test-tools-slow
