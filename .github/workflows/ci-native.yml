name: ci-native

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (L1 + L3)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache CMake FetchContent (googletest)
        uses: actions/cache@v4
        with:
          path: build/windows-x64-debug/_deps
          key: fetchcontent-windows-${{ hashFiles('native/tests/CMakeLists.txt') }}

      # third_party/opencv/<hash> をハッシュ単位でキャッシュする。ヒットすれば
      # restore は gh からの download をスキップし、既存の木を検証するだけで
      # 済む（tools/opencv.ps1 の Invoke-Restore を参照）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v4
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      # ローカルと同一のコマンドを呼ぶ。CI 専用の手順を作らない。
      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore

      - name: Run all fast lanes
        shell: pwsh
        run: ./tools/dev.ps1 test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: artifacts/test-results/
          if-no-files-found: warn
