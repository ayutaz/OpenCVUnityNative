name: ci-unity

# L4（Unity EditMode）と L5（IL2CPP Player）を CI で実行する。
# M2 完了条件 7 がこの workflow の実行そのものを求めている。
#
# ## なぜ ubuntu で、なぜ game-ci なのか
#
# ローカルのレーンは Windows で `tools/dev.ps1` が Unity を直接起動する。
# CI で同じ形にするには runner に Unity を入れる必要があるが、GitHub ホストの
# `windows-2022` に Unity は含まれない。
#
# Unity を CI で動かす標準的な方法は game-ci である。ここには当初
# 「game-ci の Windows イメージは Windows Server 2019 向けで、`windows-2022`
# では OS 不一致で落ちる」と書き、2 つの issue を根拠に挙げていた。
# **2026-08-29 に確認したところ、その 2 件は使っていない別 action のもので、
# こちらの構成について何も言っていなかった。** 経緯と現状の障害は
# docs/roadmap.md「担当が無かった制約」の Windows IL2CPP の節に集約してある。
#
# **動く根拠も動かない根拠も、こちらでは持っていない。試していないからである。**
# 試すのは M4 の担当。それまでこのレーンは ubuntu で走らせる。
# 帰結として **L5 は Windows ではなく Linux の IL2CPP Player になる。**
# L5 が捕まえたいのは managed code stripping が P/Invoke 宣言を消す問題で、
# これは IL2CPP 全体の性質であり Windows 固有ではない。Windows の IL2CPP
# Player はローカルのレーン（`dev.ps1 test-unity-player`）が引き続き担う。
#
# ## 「CI はローカルと同一のコマンドを呼ぶ」との関係
#
# この workflow は `tools/dev.ps1` で Unity を起動しない。game-ci の action が
# 起動する。不変条件との食い違いなので、隠さず書く。
#
# 代わりに **合否の判定は `tools/assert-unity-results.ps1` に出し、ローカルと
# CI の両方がそれを通る。** 起動の仕方が分かれても、判定が分かれなければ
# 「ローカルで赤いものが CI で緑になる」は起きない。とくに「0 件で緑にしない」
# はこの script が持っており、両方に効く。
#
# native plugin のビルドと OpenCV の取得は従来どおり `dev.ps1` / `opencv.ps1`
# を呼ぶ。ここは分けていない。

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write   # game-ci が結果を check run として出す

# 同じコミットに対して push と pull_request の両方が走らないようにする。
#
# 以前は group に github.ref を使っていたが、これは push ではブランチ名
# （refs/heads/foo）、pull_request では PR の参照（refs/pull/N/merge）になるため、
# **同じコミットでも別グループと見なされて重複排除が効かなかった**。実測: 2026-08-27 に
# 6cfc31d へ 37 秒差で 2 本走り、後発が資源の奪い合いで落ちた（先発は成功）。
#
# head_ref は pull_request のときだけソースブランチ名になり、push では空になる。
# ref との組み合わせで、PR がある間は PR 側の 1 本に寄る。
concurrency:
  group: ci-unity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # **他 2 platform の plugin をここでビルドする。**
  #
  # M3.5 で「全部入りの package で、Unity が自分の platform の binary だけを
  # 読む」ことを見る検査（PluginGatingTests）を足したが、**自動で走る唯一の
  # 場所であるこの workflow には Linux の .so しか無かった。** 6 件の検査が
  # 要素 1 個の集合を見て緑になるだけで、取り違えが起こりうる状況が CI では
  # 一度も成立していなかった（roadmap の M3.5 条件 3）。
  #
  # **公開済みの Release から他 platform を取ってくる形は採らない。**
  # それだと merge を止めるチェックが外部の公開物に依存し、Release を消したり
  # 名前を変えたりすると main が固まる。自分でビルドすれば依存は増えない。
  #
  # ここで作るのは **CI の中でだけ使う binary** で、配る物ではない
  # （配る物は release.yml が作る）。移植性の検査を掛けないのはそのためで、
  # この 2 つは Unity に読み込まれず、`.meta` の解釈だけが問われる。
  plugin:
    name: Plugin ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # workflow 全体には game-ci のための `checks: write` があるが、この job は
    # 使わない。最小権限にしておく。
    permissions:
      contents: read
      actions: read   # opencv.ps1 restore が gh run download を呼ぶ

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-14
          # **モバイルも重ねる。** 配る package には 6 platform 分が入るので、
          # 3 つだけで gating を検査すると「配る物とは違う形」を見ることになる。
          - platform: android-arm64
            runner: ubuntu-24.04
          - platform: ios-arm64
            runner: macos-14
          # **Web も重ねる。** 配る package には 6 platform 分が入るので、
          # 欠けたまま gating を検査すると「配る物とは違う形」を見ることになる。
          - platform: web-wasm
            runner: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # **Emscripten は emsdk から入れる。版は対応表から読む。**
      # workflow に数字を直書きしない（EmscriptenVersion.Tests.ps1 が見ている）。
      - name: Resolve the Emscripten version from the table
        if: matrix.platform == 'web-wasm'
        id: emver
        shell: pwsh
        run: |
          $table = Import-PowerShellDataFile ./tools/emscripten-versions.psd1
          $pv = Get-Content ./tests/UnityProject/ProjectSettings/ProjectVersion.txt -Raw
          $unity = ([regex]::Match($pv, 'm_EditorVersion:\s*(?<v>\S+)')).Groups['v'].Value
          $minor = ($unity -split '\.')[0..1] -join '.'
          if (-not $table.ContainsKey($minor)) { throw "Unity $minor の項が対応表にありません。" }
          "version=$($table[$minor].Emscripten)" >> $env:GITHUB_OUTPUT

      - name: Set up Emscripten
        if: matrix.platform == 'web-wasm'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.emver.outputs.version }}

      - name: Point the build at the emsdk toolchain
        if: matrix.platform == 'web-wasm'
        shell: bash
        run: echo "OCVU_EMSCRIPTEN_ROOT=$EMSDK/upstream" >> "$GITHUB_ENV"

      # macOS / Linux の preset は Ninja を使う。runner に入っていないので入れる。
      - name: Install Ninja
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build; fi

      # OpenCV の cache が無いと、job のたびに artifact を探す API 呼び出しが
      # 起きる。**レート制限に当たると、成果物にもコードにも問題が無いのに
      # CI が全部赤くなる**（実測、2026-08-29。Dependabot の PR 9 件と v0.1.1 の
      # リリースが同時に落ちた）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          # **対象 platform を明示する。** 以前は「この job は対象 platform の
          # 上で走っているので Get-OpenCvPlatform で足りる」と書いてあったが、
          # **モバイルはクロスコンパイルなので成り立たない** —— android-arm64 は
          # ubuntu の上で走るので、渡さないと linux-x64 のハッシュが出る。
          # cache だけ別 platform を指し、restore は対象を取りに行くという
          # 食い違いになる（M4 のレビューで発見）。
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig -Platform '${{ matrix.platform }}')
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore -Platform ${{ matrix.platform }}

      - name: Build the native plugin
        shell: pwsh
        run: ./tools/dev.ps1 build -Platform ${{ matrix.platform }}

      # **binary と .meta を対で運ぶ。** binary の無い .meta を置くと Unity が
      # 孤児と見なして消す（M3 のレビュー M4 で実測）。dev.ps1 build が
      # tools/plugin-meta/ から対で置くので、この木をそのまま渡す。
      - name: Upload the plugin tree
        uses: actions/upload-artifact@v7
        with:
          name: unity-plugin-${{ matrix.platform }}
          path: Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins
          if-no-files-found: error
          # **配る物ではない。** public repo なので誰でも落とせるが、これは
          # CI の中でだけ使う debug ビルドである。既定の 90 日ぶん残すと
          # release の成果物と取り違えられる。
          retention-days: 1

  unity:
    name: Unity ${{ matrix.lane }} (Linux)
    runs-on: ubuntu-24.04
    # Linux の .so はこの job が自分でビルドする（下記のとおりコンテナの中で）。
    # 他 2 platform は上の job から artifact で受け取る。
    needs: plugin

    # **`needs:` を足しただけでは、依存が落ちたときに merge が止まらない。**
    #
    # GitHub の文書はこう書いている: "Required status checks must have a
    # successful, skipped, or neutral status before collaborators can make
    # changes to a protected branch."（2026-08-30 に確認）——
    # **skip は「通った」扱いである。**
    #
    # したがって素の `needs: plugin` だと、plugin のビルドが落ちた瞬間に
    # この job は skip になり、必須チェックである "Unity EditMode (Linux)" と
    # "Unity Standalone (Linux)" が**緑と同じ意味を持ったまま merge を許す。**
    # plugin job 自体は赤くなるが、そちらは必須チェックではない。
    #
    # `!cancelled()` にすると、依存が落ちても走る。走れば材料が無いので
    # **Unity を起動する前に落ちる —— skip ではなく赤になる。** そのために
    # 材料を集める 2 step を checkout の直後に置いてある（下記）。どの step で
    # 落ちるかと、そこまでの所要時間は書かない —— どちらも測っていない。
    #
    # **`always()` にしない。** この workflow は `cancel-in-progress: true` を
    # 宣言しており、PR に push するたびに先行 run がキャンセルされる。
    # `always()` だと追い越された古い run が Unity のビルドを最後まで走らせ、
    # その宣言の目的を打ち消す。
    #
    # **残る穴を隠さず書く**: 人が手で run をキャンセルしたとき、まだ始まって
    # いないこの job が `skipped`（= 必須チェックを通す）になるのか
    # `cancelled`（= 通さない）になるのかは**確かめていない。** 前者なら、
    # 手動キャンセルした run は未検証のまま緑に見える。その run は re-run する
    # こと。
    #
    # ブランチ保護の設定ではなく workflow の構造で塞いでいるのは、**設定は
    # ファイルに現れず、差分としてレビューできないから**である。
    if: ${{ !cancelled() }}
    # **native plugin は Unity が動くコンテナと同じ世代でビルドする。**
    #
    # runner（ubuntu-24.04, glibc 2.39）でビルドした .so は、game-ci の
    # コンテナ（より古い glibc）では読み込めない。v0.1.0 で実際にこれで
    # DllNotFoundException になった。ubuntu:22.04 で作れば、game-ci の
    # コンテナでも利用者の環境でも読み込める。
    #
    # game-ci の action は docker を使うので、この job 自体はコンテナに
    # 入れない——入れると docker in docker になる。plugin のビルドだけを
    # コンテナで行う（下の「Build the native plugin」を参照）。
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # L4: Mono の Editor 上で走る。IL2CPP は要らないので base で足りる。
          - lane: EditMode
            testMode: EditMode
            imageFlavour: base
            # **このレーンだけが gating を走らせる。** PluginGatingTests は
            # UnityEditor に依存する Editor 専用のテストなので、Player の
            # 中では走らない。走ったことを結果 XML で確かめる（下の
            # 「Assert the results」）。
            # **クラス名だけでは足りない。** -RequireTest は「1 件でも Passed が
            # あるか」を見るので、gating を実際に行う 4 件を消して残り 2 件
            # （0 件で緑にしない検査と、数を報告する検査）だけにしても満たせる。
            # 名指しする。';' 区切り。
            requireTest: 'PluginGatingTests.ExactlyOnePluginTargetsThisEditorOs;PluginGatingTests.EachPluginTargetsOnlyItsOwnEditorOs;PluginGatingTests.NoPluginIsEnabledForEveryPlatform;PluginGatingTests.EachPluginIsEnabledOnlyForItsOwnStandaloneTarget'
            # **入力ではなく結果を見る。** 合図が届かなければ gating は
            # 「1 つ以上」しか要求せず、そのときの出力は意図どおり動いた
            # 場合と 1 バイトも違わない。テスト自身が出した事実を要求すれば、
            # 合図の経路が壊れた時点で赤くなる。**このレーンは 6 platform を
            # 重ねてから走るので、無条件に全部を要求してよい。**
            # 末尾の '[' まで含めるのは境界のため。'present: 5' だけだと
            # 'present: 50' にも当たる。
            # **2 つ要求する**（';' 区切り。assert-unity-results.ps1 が split する）。
            #
            # 2 つ目は I-1 のレビュー指摘で足した。`ProfileGatingTests` を
            # 「define が無ければ無い」から「define の有無と一致する」に変えた
            # ことで、**既定のレーンから「立っていないこと」への要求が消えた** ——
            # 誰かが ProjectSettings.asset に OCVU_PROFILE_DNN を commit すると、
            # このレーンは陽性の分岐を通って**緑のまま**になる。
            # dnn を切った利用者のビルドが壊れないことを見るはずのレーンが、
            # dnn を入れた状態を見ていることになる。
            requireOutput: 'native plugins present: 6 [;OCVU_PROFILE_DNN is not defined'
            # **`tools/dev.ps1` の `Test-UnityEditMode` と同じ除外を CI にも渡す。**
            #
            # ローカルは `-batchmode -nographics -testCategory '!Graphics'` で
            # 起動する（`GraphicsTests` / `GraphicsBenchmarkRunner` を除外する）。
            # この workflow は customParameters を 1 つも渡していなかったので、
            # ここだけ除外が効かず `[Category("Graphics")]` のテストがそのまま
            # 実行されていた。
            #
            # **`-nographics` の下では GPU に依る検査が本物の欠陥として落ちる。**
            # 実測（2026-09-05、Unity 6000.3.16f1）: `-nographics` では
            # `SystemInfo.graphicsDeviceType` が `Null` になり、
            # `RenderTexture.Create()` は true を返すのに `GL.Clear(10,20,30)` の
            # 直後の `ReadPixels` が書いた色ではなく 205,205,205 を返す。
            # `GraphicsChecks.AGraphicsDeviceIsPresent` は GPU が無ければ
            # **skip ではなく fail する**設計なので、この除外が無いと
            # 必須チェック "Unity EditMode (Linux)" が GPU の有無にかかわらず
            # 危うい: GPU が無ければ赤くなって merge を止め、GPU が在っても
            # `docs/performance.md` / `docs/roadmap.md` に書いた「この経路は
            # test-unity-graphics 経由でしか走っていない」という前提が崩れる。
            # `game-ci/unity-test-runner` の `customParameters` は
            # `-testCategory !Graphics` をそのまま Unity Editor の起動コマンドへ
            # 展開する（コンテナ側の `run_tests.sh` が `$CUSTOM_PARAMETERS` を
            # 展開する行。展開は bash の非対話シェルなので `!` は履歴展開の
            # 対象にならず、そのまま 1 トークンとして渡る——引用符で囲むと逆に
            # 引用符ごと 1 トークンになり `!Graphics` に一致しなくなる）。
            customParameters: '-testCategory !Graphics'
            # **既定 profile。** 空文字を渡すのは requireTest / customParameters と
            # 同じ理由で、「渡し忘れ」と「意図的に何も立てない」を区別できる形に
            # しておくためである。下の Dnn レーンだけがここに値を持つ。
            defineSymbols: ''
          # L5: 実際に IL2CPP Player をビルドして、その上で走らせる。
          # scripting backend と stripping level は ProjectSettings に
          # コミットしてあるので（scriptingBackend.Standalone: 1、
          # managedStrippingLevel.Standalone: 2）、ここで設定する必要はない。
          - lane: Standalone
            testMode: Standalone
            # Editor 専用のテストは Player に入らないので、要求しない。
            requireTest: ''
            requireOutput: ''
            # Linux の IL2CPP Player を作るので、その道具が入ったイメージが要る。
            # base では IL2CPP のビルドができない。
            imageFlavour: linux-il2cpp
            # **このレーンには渡さない。** `GraphicsTests` / `GraphicsBenchmarkRunner`
            # が載っている `CvUnity.Tests.EditMode` asmdef は
            # `"includePlatforms": ["Editor"]` なので、そもそも Standalone の
            # Player には 1 行もコンパイルされず、除外するテストが存在しない。
            # 空文字を渡すのは requireTest / requireOutput と同じ理由（渡し忘れと
            # 意図的な空を区別できる形にする）。
            customParameters: ''
            defineSymbols: ''

          # **GPU に依る経路を CI で実際に走らせる（`[Category("Graphics")]`）。**
          #
          # **これを足せたのは、game-ci の Editor が -nographics で走っていない
          # と実測で分かったからである。** コンテナの `unity-editor` は
          #
          #     xvfb-run -ae /dev/stdout "$UNITY_PATH/Editor/Unity" -batchmode "$@"
          #
          # で、**仮想 X の下で、-nographics 無しで**起動する（game-ci/docker の
          # images/ubuntu/editor/Dockerfile）。したがって
          # `SystemInfo.graphicsDeviceType` が Null にならない可能性があり、
          # ローカル専用だった `dev.ps1 test-unity-graphics` と同じものを
          # CI で走らせられる見込みが立った。
          #
          # **見込みであって、Dockerfile からは決まらない。** `unityci/base` は
          # `--no-install-recommends` で `libglu1` しか入れておらず、Mesa の
          # 実装（`libglx-mesa0` / `libgl1-mesa-dri`）が入るかは依存の解決次第
          # である。**だから推測で書かず、このレーンそのものを実測に使った** ——
          # 結論は docs/roadmap.md の「GPU 経路を CI に載せる」にある。
          #
          # **GPU が無ければ skip ではなく fail する。** `AGraphicsDeviceIsPresent`
          # がそう書かれており（GraphicsChecks）、それが正しい —— 「GPU が無い
          # から確かめられなかった」を緑にすると、このレーンは在るのに何も
          # 見ていない状態になる。
          - lane: Graphics
            testMode: EditMode
            # GPU に依るのは Editor 側の経路で、IL2CPP は要らない。
            imageFlavour: base
            # **名指しする。** category の綴りを間違えると 0 件になり、
            # 「passed が 1 以上」は他のテストでは満たせない（このレーンは
            # Graphics だけを走らせる）——それでも、どれが通ったかを要求する
            # ほうが強い。GPU が要る 5 件と、このレーンでしか測れない
            # benchmark を名指しする。
            # **`EveryCheckInTheSharedBodyIsWiredIntoThisEntryPoint` を落とさない。**
            # 共有本体（GraphicsChecks）に足した検査が入口に配線されているかを
            # 見る唯一のテストで、**これが assembly から外れても残り 6 件で
            # 緑になる。** 名指しの中で最も消えたら困る 1 件である。
            requireTest: 'GraphicsTests.AGraphicsDeviceIsPresent;GraphicsTests.SyncReadbackProducesTheExpectedPixels;GraphicsTests.VerticalFlipIsApplied;GraphicsTests.AsyncMatchesSync;GraphicsTests.TakingTheMatTwiceIsRejected;GraphicsTests.EveryCheckInTheSharedBodyIsWiredIntoThisEntryPoint;GraphicsBenchmarkRunner.MeasureRenderTexturePaths'
            requireOutput: ''
            # **`!Graphics` の補集合。** 2 つで完全に分かれる。
            customParameters: '-testCategory Graphics'
            defineSymbols: ''

          # **非既定 profile（dnn）を Unity の中で実際にコンパイルする。**
          #
          # M7c が残した穴そのものである —— それまで
          # **どの workflow も、どの dev.ps1 のレーンも `OCVU_PROFILE_DNN` を
          # 立てていなかった**ので、`CvUnity.Interop.Dnn` / `CvUnity.Dnn` が
          # Unity の中でコンパイルできることは人が手で 1 回確かめたきりだった。
          #
          # **define は下の step が ProjectSettings.asset に書き込む。**
          # `ProfileGatingTests` が「立っていない」方向を、このレーンが
          # 「立てれば現れる」方向を見る —— **1 回の実行では原理的に
          # 届かない**と同 class の docstring が書いていたのは正しく、
          # 届かせるには実行を 2 つに分けるしかない。
          - lane: DnnEditMode
            testMode: EditMode
            imageFlavour: base
            # **define を立てた側でしか通らないものを名指しする。**
            # 立て損ねたら（書き込みが空振りしたら）このレーンは赤くなる。
            requireTest: 'ProfileGatingTests.TheDnnInteropAssemblyMatchesTheDefine;ProfileGatingTests.TheDnnSharedTestAssemblyMatchesTheDefine;ProfileGatingTests.TheDnnPublicApiAssemblyMatchesTheDefine'
            # **テスト自身が出した事実を要求する。** 名前だけだと、define が
            # 無い側の分岐を通っても同じ名前が Passed で並ぶ。
            requireOutput: 'OCVU_PROFILE_DNN is defined and the dnn assemblies are compiled'
            customParameters: '-testCategory !Graphics'
            defineSymbols: 'OCVU_PROFILE_DNN'

          # **stripping 済みの実物の Player で、dnn の P/Invoke が生き残ること。**
          #
          # 既定 profile の `AbiSurfacePlayerTests` と同じ役割を dnn 側で果たす。
          # **Player でしか確かめられない** —— IL2CPP の stripping が消せるのは
          # 呼ばれない宣言なので、Editor(Mono) では成立しない。
          - lane: DnnStandalone
            testMode: Standalone
            imageFlavour: linux-il2cpp
            # 4 本の宣言を 1 回ずつ呼ぶ生成物の、手書きの唯一の入口。
            requireTest: 'AbiSurfaceDnnPlayerTests.EveryDnnEntryPointIsReachable'
            requireOutput: ''
            # EditMode 専用の asmdef は Player に入らないので、除外する対象が無い。
            customParameters: ''
            defineSymbols: 'OCVU_PROFILE_DNN'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # **材料は先に集める。**
      #
      # 依存（plugin job）が落ちても、上の `if: !cancelled()` でこの job は
      # 走る。そのときここまでで落ちれば、Linux の container build（apt +
      # cmake + OpenCV restore + native build）を 2 レーン分捨てずに済む。
      # plugin の失敗は rate limit や brew の一時障害という**再発しやすい形**
      # なので、捨てる量が効いてくる。
      #
      # 先に重ねても後段は壊れない —— `dev.ps1 build` は自分の platform の
      # binary と `tools/plugin-meta/<platform>/` しか Copy-Item -Force せず、
      # Plugins/ を掃除しないので、他 platform のファイルはそのまま残る。
      - name: Download the other platforms' plugins
        uses: actions/download-artifact@v8
        with:
          pattern: unity-plugin-*
          path: other-plugins

      - name: Assemble every platform into one package
        shell: pwsh
        run: |
          # **6 platform すべてを重ねる。** PluginGatingTests が Slots の数
          # （6）を要求するので、足りないまま重ねると落ちる —— そして落ちるのが
          # 正しい。配る package には 6 つ入るからである。
          $sources = @('windows-x64', 'macos-arm64', 'android-arm64', 'ios-arm64', 'web-wasm') |
                     ForEach-Object { "other-plugins/unity-plugin-$_" }
          ./tools/assemble-plugins.ps1 -Source ($sources -join ';')

      # **Unity のバージョンを workflow に直書きしない。** 直書きすると
      # ProjectVersion.txt と二重管理になり、片方だけ上げたときに気づけない
      # （このリポジトリが繰り返している「2 箇所に同じ事実を書く」欠陥）。
      # game-ci に渡すイメージ名もここから組み立てる。
      - name: Resolve the Unity version
        id: unity
        shell: pwsh
        run: |
          $file = 'tests/UnityProject/ProjectSettings/ProjectVersion.txt'
          $m = Select-String -LiteralPath $file -Pattern '^m_EditorVersion:\s*(\S+)' |
               Select-Object -First 1
          if (-not $m) {
              Write-Error "could not read m_EditorVersion from $file"
              exit 1
          }
          $version = $m.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "image=unityci/editor:ubuntu-$version-${{ matrix.imageFlavour }}-3" >> $env:GITHUB_OUTPUT
          Write-Host "==> Unity $version / ubuntu-$version-${{ matrix.imageFlavour }}-3"

      # **OpenCV をホスト側でキャッシュする。** ビルドはコンテナの中で
      # 行うが、ワークスペースは mount されているので、ホストに展開して
      # おけばコンテナからそのまま見える。restore は木が既に在れば
      # download を丸ごと省く。
      #
      # これが無いと、この job が走るたびに artifact を探す API 呼び出しが
      # 発生する。**多数の workflow を同時に走らせるとレート制限に当たり、
      # 成果物にもコードにも問題が無いのに CI が全部赤くなる**（実測、
      # 2026-08-29。Dependabot の PR 9 件と v0.1.1 のリリースが同時に落ちた）。
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          # -Platform を渡さない（plugin job と同じ理由。restore 側の自動判定と
          # 二重の正本にしない）。この job は ubuntu の上で走っている。
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      # OpenCV の取得と native plugin のビルドは、**Unity が動くコンテナと
      # 同じ世代**で行う。runner（ubuntu-24.04, glibc 2.39）で作った .so は
      # game-ci のコンテナでは読み込めず、v0.1.0 で実際に
      # DllNotFoundException になった。
      #
      # job 自体をコンテナに入れないのは、game-ci の action が docker を
      # 使うためである（入れると docker in docker になる）。ビルドだけを
      # コンテナで走らせ、成果物はワークスペース経由で受け渡す。
      #
      # 使うイメージは tools/opencv-config.psd1 の
      # Toolchains['linux-x64'].Container と同じでなければならない。
      # 食い違うと構成ハッシュが指す artifact と別物ができる。
      - name: Build the native plugin in the build container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(grep -oP "Container\s*=\s*'\K[^']+" tools/opencv-config.psd1 | head -1)
          echo "==> building in $image"
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e GH_TOKEN \
            "$image" \
            bash -c 'bash ./tools/ci/setup-linux-container.sh \
                     && pwsh -NoProfile -File ./tools/opencv.ps1 restore \
                     && pwsh -NoProfile -File ./tools/dev.ps1 build'
          # コンテナは root で書くので、以降の step が読めるように直す。
          sudo chown -R "$(id -u):$(id -g)" \
            Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins build third_party || true

      # **支える予定より新しい環境を要求していないか。** ここで捕まえないと、
      # 失敗が Unity の DllNotFoundException として出て原因が 1 段遠くなる。
      - name: Verify the plugin's portability
        shell: pwsh
        run: ./tools/verify-plugin-portability.ps1

      # 置けたことを Unity より先に確かめる。plugin が無いまま Unity を
      # 走らせると、失敗が「テストが落ちた」ではなく「DllNotFoundException」
      # として出て、原因が 1 段遠くなる。
      - name: Check that the plugin and its import settings are in place
        shell: pwsh
        run: |
          $dir = 'Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins/Linux/x86_64'
          foreach ($f in @("$dir/libopencv_unity_native.so", "$dir/libopencv_unity_native.so.meta")) {
              if (-not (Test-Path -LiteralPath $f)) {
                  Write-Error "missing: $f"
                  exit 1
              }
              Write-Host "==> present: $f"
          }

      # **重ねられたことを Unity より先に確かめ、そのうえでテストに合図を渡す。**
      #
      # 合図をファイルにしているのは、**game-ci がコンテナへ渡す環境変数が固定の
      # 一覧だから**である（ImageEnvironmentFactory）。`env:` に任意の名前を書いても
      # Unity 側には届かず、テストは「合図が無い」分岐に落ちて **要素 1 個でも
      # 緑になる** —— 塞ごうとしている穴と同じ壊れ方を、合図の側がする。
      # ワークスペースはコンテナに mount されるので、ファイルなら確実に届く。
      - name: Check every platform is in place, and tell the tests to expect them all
        shell: pwsh
        run: |
          $root = 'Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins'
          $expected = @(
              'x86_64/opencv_unity_native.dll'
              'macOS/libopencv_unity_native.dylib'
              'Linux/x86_64/libopencv_unity_native.so'
              'Android/arm64-v8a/libopencv_unity_native.so'
              'iOS/libopencv_unity_native.a'
              'WebGL/libopencv_unity_native.a'
          )
          foreach ($rel in $expected) {
              foreach ($f in @("$root/$rel", "$root/$rel.meta")) {
                  if (-not (Test-Path -LiteralPath $f)) {
                      Write-Error "missing: $f"
                      exit 1
                  }
                  Write-Host "==> present: $f"
              }
          }
          Set-Content -LiteralPath 'tests/UnityProject/ocvu-expect-all-platforms' `
                      -Value '1' -NoNewline

      # **このレーンだけ scripting define symbols を立てる。**
      #
      # `OCVU_PROFILE_DNN` を立てると `CvUnity.Interop.Dnn` / `CvUnity.Dnn` /
      # `CvUnity.Tests.Shared.Dnn` がコンパイル対象に入る（asmdef の
      # defineConstraints）。**Unity の compilation pipeline が見るのはここで、
      # `csc.rsp` では届かない** —— あちらはコンパイラに渡る define であって、
      # Unity が defineConstraints を評価するときの集合ではない。
      #
      # **書き換えが空振りしたら落とす。** 空振りすると define の無い側の
      # 分岐を通って**同じテスト名が Passed で並ぶ**ので、出力からは
      # 区別が付かない。入力（ここ）と出力（assert-unity-results.ps1 の
      # -RequireOutput）の両方で見る —— 入力だけでは「書いたつもり」を、
      # 出力だけでは「なぜ立たなかったか」を取り逃がす。
      - name: Turn on the scripting define symbols for this lane
        if: matrix.defineSymbols != ''
        shell: pwsh
        run: |
          $file = 'tests/UnityProject/ProjectSettings/ProjectSettings.asset'
          $text = Get-Content -LiteralPath $file -Raw

          # 既定は空の map。ここが変わったら、黙って no-op にせず落とす。
          $empty = "`n  scriptingDefineSymbols: {}`n"
          if ($text -notmatch [regex]::Escape($empty)) {
              Write-Error "scriptingDefineSymbols is not the expected empty map in $file"
              exit 1
          }

          # キーは NamedBuildTarget の名前。同じファイルの scriptingBackend が
          # 'Standalone' を使っているので、それに合わせる。
          $filled = "`n  scriptingDefineSymbols:`n    Standalone: ${{ matrix.defineSymbols }}`n"
          $text = $text.Replace($empty, $filled)
          Set-Content -LiteralPath $file -Value $text -NoNewline

          # 書けたことを読み直して確かめる。
          $after = Get-Content -LiteralPath $file -Raw
          if ($after -notmatch [regex]::Escape('Standalone: ${{ matrix.defineSymbols }}')) {
              Write-Error 'failed to write the scripting define symbols'
              exit 1
          }
          Write-Host '==> scripting define symbols: ${{ matrix.defineSymbols }}'

      # **pre-release を固定してある。** これだけが node20 を宣言する action
      # だった（GitHub は 2025-09 に node20 を非推奨にし、いまは node24 上で
      # 強制実行している —— 実測: ci-unity の annotation に
      # `being forced to run on Node.js 24` が出ていた）。
      #
      # **安定版に node24 のものが無い。** `@v4` と最新安定版 `@v4.3.1` は
      # 同一コミットで、どちらも node20 である。node24 なのは
      # `v5.0.0-beta.1`（2026-08-18）だけ。
      #
      # **action.yml の差は node20 -> node24 の 1 行だけである**（実測。
      # 入力 24 個・出力 2 個とも名前も既定値も同一）。**ただしそれは
      # インタフェースの話であって、挙動の証明ではない** —— 中身は
      # `dist/index.js` に在り、そちらは実装が game-ci/cli の
      # `plugins/unity/` へ移ったことで大きく入れ替わっている。
      # **挙動の根拠はこの PR の CI run そのものに置く**（EditMode と
      # IL2CPP Standalone が両方緑になったこと）。
      #
      # 上流は「main CI ではなく別 workflow で試すのが安全」と書いている。
      # **それでもここに入れたのは、このレーンが必須チェックだからである** ——
      # 壊れていれば PR が merge できない。判定は CI がする。
      #
      # **タグではなく commit で固定する。** pre-release のタグは上流が
      # 消せる —— v5.0.0 が正式に出た日に `v5.0.0-beta.1` が消えると、
      # こちらは 1 行も変えていないのに**全 PR が merge できなくなる**
      # （必須チェックが「action を解決できない」で落ちるため）。
      # major を指すタグ（`@v7` など）が動くのは上流が維持する約束が
      # あるからで、pre-release にその約束は無い。
      - name: Run ${{ matrix.lane }} tests
        uses: game-ci/unity-test-runner@f7d28f891263d875d47ef34370e9e8dd6087e1ef # v5.0.0-beta.1
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tests/UnityProject
          unityVersion: ${{ steps.unity.outputs.version }}
          customImage: ${{ steps.unity.outputs.image }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/unity-${{ matrix.lane }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # 既定の checkName は lane 間で衝突するので分ける。
          checkName: ${{ matrix.lane }} results
          # EditMode だけ `!Graphics` を除外する（matrix 側のコメント参照）。
          # Standalone は空文字——渡さないのではなく、渡すものが無いことを
          # 明示する。
          customParameters: ${{ matrix.customParameters }}

      # **game-ci が緑でも、ここで独立に判定する。**
      #
      # 「0 件で緑にしない」はこのリポジトリの不変条件で、ローカルのレーンは
      # それを持っている。CI 側だけ持たないと、テストが全部消えたときに
      # ローカルは赤・CI は緑という最も紛らわしい状態になる。
      # ローカルと同じ script を通す。
      - name: Assert the results
        if: always()
        shell: pwsh
        run: |
          $xml = Get-ChildItem -Path 'artifacts/unity-${{ matrix.lane }}' -Filter '*.xml' -Recurse -File |
                 Select-Object -First 1
          if (-not $xml) {
              Write-Error 'no test result XML was produced under artifacts/unity-${{ matrix.lane }}'
              exit 1
          }
          $params = @{
              ResultsPath = $xml.FullName
              Lane        = '${{ matrix.lane }}'
          }
          # **空文字を渡さない。** 部分一致なので、空だと何にでも一致して
          # 「要求したことになっているが何も要求していない」状態になる。
          if ('${{ matrix.requireTest }}') {
              $params.RequireTest = '${{ matrix.requireTest }}' -split ';'
          }
          if ('${{ matrix.requireOutput }}') {
              $params.RequireOutput = '${{ matrix.requireOutput }}'
          }
          ./tools/assert-unity-results.ps1 @params

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unity-${{ matrix.lane }}
          path: artifacts/unity-${{ matrix.lane }}
          if-no-files-found: warn

  # **測った数字を CI が publish する。**
  #
  # `dev.ps1 benchmark` は M7a から在るが、**どの workflow からも走って
  # いなかった** —— しかも唯一 Unity を持つ開発機では、内部で呼ぶ
  # `test-unity-player` が後始末でハングする既知の欠陥のせいで**完走しない**。
  # 数字は「ハングしたプロセスを止めてから `run-benchmarks.ps1` を直接叩く」
  # という手順でしか得られていなかった。
  #
  # **GPU に依る側が CI で走るようになって初めて、この job が成立した。**
  # `GraphicsBenchmarkRunner` は `Graphics` レーンにしか居ないので、
  # そのレーンが無い間はここで集められるのは半分だけだった。
  #
  # **時間そのものは判定しない**（設計 D1）。`run-benchmarks.ps1` が落ちるのは
  # 「測れなかったとき」だけである —— XML ごとに 1 本も `OCVU_BENCH:` が
  # 拾えなかったか、値が 0 だったとき。共有 runner の上で閾値を置くと
  # フレークになるので、速い・遅いでは落とさない。
  benchmarks:
    name: Publish the benchmarks
    runs-on: ubuntu-24.04
    needs: unity
    # **必須チェックへ昇格したので、`if: !cancelled()` を付けた。**
    #
    # 素の `needs:` だと、`unity` が落ちた瞬間にこの job は **skip** になる。
    # **GitHub は skip を required check の合格として通す**ので、必須に
    # したまま素の `needs:` を残すと、**依存が落ちているのに緑と同じ意味を
    # 持つ**（`unity` job の長いコメントが同じことを書いている）。
    #
    # `!cancelled()` なら依存が落ちても走り、集める XML が無いので
    # 「artifact が無い」で**赤くなる** —— skip ではなく赤である。
    #
    # **`always()` にしない。** この workflow は `cancel-in-progress: true` を
    # 宣言しており、`always()` だと追い越された古い run が最後まで走る。
    if: ${{ !cancelled() }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the Player results
        uses: actions/download-artifact@v8
        with:
          name: test-results-unity-Standalone
          path: bench-in/standalone

      - name: Download the Graphics results
        uses: actions/download-artifact@v8
        with:
          name: test-results-unity-Graphics
          path: bench-in/graphics

      # **これは `dev.ps1` の `Invoke-Benchmark` の 2 つ目の写しである。**
      #
      # 同じブランチの `tarball` job は「作り方を CI に書き写すと別物になる」
      # という理由で `-PrepareOnly` を作ったのに、こちらは写している
      # （レビュー指摘 M-4）。**写したまま残す判断の理由**: あちらが寄せたのは
      # **出来る物**（使い捨てプロジェクト）で、こちらが持つのは
      # **どのレーンの XML を集めるか**という配線だけである。
      # `dev.ps1` 側はローカルのレーン名（`unity-player.xml` /
      # `unity-graphics.xml`）を、CI 側は artifact 名を指すので、
      # **同じ物を指す 1 つの表にはできない。** 集計と判定そのものは
      # `run-benchmarks.ps1` に寄せてあり、そこは分かれていない。
      # **3 本目の benchmark レーンを足すときは、両方を直すこと。**
      #
      # **2 つの XML を名指しで渡す。** `run-benchmarks.ps1` は
      # **XML ごとに**「1 本も拾えなかったか」を見るので、片方のレーンの
      # benchmark 本体が丸ごと消えても、もう片方の行に紛れて通ることはない。
      - name: Collect the benchmark results
        shell: pwsh
        run: |
          $paths = @()
          foreach ($dir in @('bench-in/standalone', 'bench-in/graphics')) {
              $xml = Get-ChildItem -Path $dir -Filter '*.xml' -Recurse -File |
                     Select-Object -First 1
              if (-not $xml) {
                  Write-Error "no test result XML under $dir"
                  exit 1
              }
              Write-Host "==> $dir -> $($xml.FullName)"
              $paths += $xml.FullName
          }
          ./tools/run-benchmarks.ps1 -XmlPath ($paths -join ';') `
                                     -OutPath artifacts/benchmarks/latest.json
          Get-Content -LiteralPath artifacts/benchmarks/latest.json

      - name: Upload the benchmarks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: artifacts/benchmarks
          if-no-files-found: warn

  # **配る tarball を、使い捨ての Unity プロジェクトに実際に導入する。**
  #
  # `dev.ps1 test-unity-tarball` は M3 から在るのに、**どの workflow からも
  # 走っていなかった** —— roadmap は M4 の時点で「game-ci の action の外で
  # Unity を起動する必要があり、CI に載せるのは別作業である」と書き、
  # そのまま置かれていた。
  #
  # **走らないレーンは腐る、を 2 度実証した後で載せる。**
  #   - M4 でモバイルを足したとき、期待する binary の数が `3` と直書きされて
  #     いて iOS の `.a` を binary と認めなかった
  #   - M7a で Graphics の除外が抜け、66 件中 6 件が落ちる状態になった
  #   どちらも**無関係な作業の途中で 1 度手で回すまで誰も知らなかった。**
  #
  # **`unity` job に相乗りしない。** あちらは `tests/UnityProject` を直接
  # 指すが、このレーンの本体は**使い捨てのプロジェクトを作るところ**にある
  # （tarball から解決させ、ディレクトリ参照が 1 つも残っていないことまで
  # 見る）。projectPath が違うので matrix には畳めない。
  #
  # プロジェクトの作り方は `dev.ps1 test-unity-tarball -PrepareOnly` に寄せて
  # ある —— ここに書き写すと、**導入を確かめた tarball と実際に配る
  # tarball が別物になる。**
  tarball:
    name: UPM tarball install (Linux)
    runs-on: ubuntu-24.04
    needs: plugin
    # `unity` job と同じ理由（そちらの長いコメントを参照）。skip は必須
    # チェックを通すので、材料が無いときは赤くなる形にする。
    if: ${{ !cancelled() }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the other platforms plugins
        uses: actions/download-artifact@v8
        with:
          pattern: unity-plugin-*
          path: other-plugins

      - name: Assemble every platform into one package
        shell: pwsh
        run: |
          $sources = @('windows-x64', 'macos-arm64', 'android-arm64', 'ios-arm64', 'web-wasm') |
                     ForEach-Object { "other-plugins/unity-plugin-$_" }
          ./tools/assemble-plugins.ps1 -Source ($sources -join ';')

      - name: Resolve the Unity version
        id: unity
        shell: pwsh
        run: |
          $file = 'tests/UnityProject/ProjectSettings/ProjectVersion.txt'
          $m = Select-String -LiteralPath $file -Pattern '^m_EditorVersion:\s*(\S+)' |
               Select-Object -First 1
          if (-not $m) {
              Write-Error "could not read m_EditorVersion from $file"
              exit 1
          }
          $version = $m.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "image=unityci/editor:ubuntu-$version-base-3" >> $env:GITHUB_OUTPUT

      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      # `unity` job と同じ理由でコンテナの中でビルドする（runner の glibc で
      # 作った .so は game-ci のコンテナでは読み込めない。v0.1.0 の欠陥）。
      - name: Build the native plugin in the build container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(grep -oP "Container\s*=\s*'\K[^']+" tools/opencv-config.psd1 | head -1)
          echo "==> building in $image"
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e GH_TOKEN \
            "$image" \
            bash -c 'bash ./tools/ci/setup-linux-container.sh \
                     && pwsh -NoProfile -File ./tools/opencv.ps1 restore \
                     && pwsh -NoProfile -File ./tools/dev.ps1 build'
          sudo chown -R "$(id -u):$(id -g)" \
            Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins build third_party || true

      - name: Verify the plugin's portability
        shell: pwsh
        run: ./tools/verify-plugin-portability.ps1

      # **プロジェクトの作り方はローカルと同じ script を通す。**
      #
      # `-PrepareOnly` は Unity を起動せず、作ったプロジェクトのパスを
      # 最後の 1 行に出す。`-WorkDir` はワークスペースの中でなければ
      # ならない —— game-ci はコンテナにワークスペースを mount するので、
      # その外に作ったプロジェクトはコンテナから見えない。
      - name: Prepare a disposable Unity project from the tarball
        id: prepare
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE 'artifacts/tarball-lane'
          # **$LASTEXITCODE と、出来た物の存在の両方を見る。**
          #
          # レビューは「`&` で .ps1 を呼んでも $LASTEXITCODE は設定されない
          # ので見ても無駄」と指摘したが、**実測すると設定される** ——
          # `exit 7` する .ps1 を `& child.ps1 | Select-Object -Last 1` で
          # 呼ぶと $LASTEXITCODE は 7 になった（パイプ越しでも同じ）。
          # `tools/dev.ps1` の失敗経路 `Write-DevFailure` は throw ではなく
          # **`exit 1`** なので（そちらの docstring に理由がある）、ここを
          # 見ないと**静かに次へ進む。**
          #
          # **指摘をそのまま適用しかけて、測って引き返した。** このリポジトリの
          # 「仮説のまま直さない」がレビューの指摘にも同じだけ掛かる。
          $project = & ./tools/dev.ps1 test-unity-tarball -PrepareOnly -WorkDir $work |
                     Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) {
              Write-Error "dev.ps1 test-unity-tarball -PrepareOnly failed (exit $LASTEXITCODE)"
              exit 1
          }
          if (-not $project -or -not (Test-Path -LiteralPath $project)) {
              Write-Error "the prepared project path does not exist: $project"
              exit 1
          }
          $rel = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $project).Replace([char]92, [char]47)
          "project=$rel" >> $env:GITHUB_OUTPUT
          Write-Host "==> prepared project: $rel"

      # **合図を「書く」のではなく「届いたか」を見る。**
      #
      # `unity` job はここで合図を書くが、このレーンでは `dev.ps1` が
      # **木から導出して**置く（Sync-AllPlatformsMarker。6 つ揃っていなければ
      # 置かず、置き去りがあれば消す）。ここで書き直すと、導出が壊れていても
      # 合図だけは在る状態を自分で作ってしまう。**導出の結果を要求するほうが
      # 強い。**
      - name: Check the all-platforms marker reached the prepared project
        shell: pwsh
        run: |
          $marker = Join-Path '${{ steps.prepare.outputs.project }}' 'ocvu-expect-all-platforms'
          if (-not (Test-Path -LiteralPath $marker)) {
              Write-Error "the prepared project has no all-platforms marker at $marker"
              exit 1
          }
          Write-Host "==> present: $marker"

      - name: Run the EditMode tests in the prepared project
        uses: game-ci/unity-test-runner@f7d28f891263d875d47ef34370e9e8dd6087e1ef # v5.0.0-beta.1
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ steps.prepare.outputs.project }}
          unityVersion: ${{ steps.unity.outputs.version }}
          customImage: ${{ steps.unity.outputs.image }}
          testMode: EditMode
          artifactsPath: artifacts/unity-tarball
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Tarball results
          customParameters: '-testCategory !Graphics'

      - name: Assert the results
        if: always()
        shell: pwsh
        run: |
          $xml = Get-ChildItem -Path 'artifacts/unity-tarball' -Filter '*.xml' -Recurse -File |
                 Select-Object -First 1
          if (-not $xml) {
              Write-Error 'no test result XML was produced under artifacts/unity-tarball'
              exit 1
          }
          ./tools/assert-unity-results.ps1 `
            -ResultsPath $xml.FullName `
            -Lane 'tarball' `
            -RequireTest 'PluginGatingTests.ExactlyOnePluginTargetsThisEditorOs;PluginGatingTests.EachPluginTargetsOnlyItsOwnEditorOs;PluginGatingTests.NoPluginIsEnabledForEveryPlatform;PluginGatingTests.EachPluginIsEnabledOnlyForItsOwnStandaloneTarget' `
            -RequireOutput 'native plugins present: 6 [;OCVU_PROFILE_DNN is not defined'

      # **テストが通ったことは、tarball で解決された証拠にならない。**
      # テストはパッケージの外（プロジェクトの Assets/）に在るので、
      # ディレクトリ参照で解決されても同じ数だけ通る。UPM が書き戻した
      # packages-lock.json を読んで、参照が本当に .tgz だったかを見る。
      # ローカルの `dev.ps1` はこれを自分でやっているが、こちらは Unity の
      # 起動が game-ci なので、同じ判定をここに置く。
      - name: Check that UPM resolved the package from the tarball
        if: always()
        shell: pwsh
        run: |
          $lock = Join-Path '${{ steps.prepare.outputs.project }}' 'Packages/packages-lock.json'
          if (-not (Test-Path -LiteralPath $lock)) {
              Write-Error "UPM did not write back $lock, so we cannot tell how the package resolved"
              exit 1
          }
          $manifest = Get-Content -LiteralPath $lock -Raw | ConvertFrom-Json
          $entry = $manifest.dependencies.'com.ayutaz.opencv-unity-native'
          $resolved = if ($entry) { $entry.version } else { '(no entry)' }
          if ($resolved -notlike '*.tgz') {
              Write-Error "UPM resolved from a non-tarball reference: $resolved"
              exit 1
          }
          Write-Host "==> resolved from $resolved"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unity-tarball
          path: artifacts/unity-tarball
          if-no-files-found: warn

  # **ブラウザで実際に動かす。** これが「動く」を主張できる唯一のレーンである
  # （`add-a-platform` skill の「ビルドできる / 配れる / 動く」）。
  #
  # **上の unity job とは別の job にしてある** —— あちらは
  # `game-ci/unity-test-runner` が Test Framework を回す形だが、
  # **Unity Test Framework は WebGL の Player を batchmode から走らせられない**
  # （実行にはブラウザが要る）。だから Player を建てる job と、
  # それをブラウザで駆動する step を自分で組む。
  web-e2e:
    name: Web browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: plugin
    # **needs を持つ job は `!cancelled()` で守る。** ゆるい条件だと
    # 必須チェックが常時 skip になりうる（CLAUDE.md の該当節）。
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    env:
      # **Player の出来る場所を 1 箇所に持つ。**
      #
      # `BuildPlayer.BuildWebGL` は `OCVU_WEB_BUILD_DIR` が無ければ
      # **CWD 直下の `build/web-player`** に落とす。**この job の CWD は
      # Unity プロジェクト**（`tests/UnityProject`）なので、出来るのは
      # repo root ではなくその下である。**2026-09-03 に CI で実測した**:
      #
      #     out=/github/workspace/tests/UnityProject/build/web-player
      #
      # **`buildsPath` / `buildName` では動かせない。** game-ci が
      # `-customBuildPath` を渡すのは自前の build method に対してだけで、
      # **`buildMethod` を指定すると渡らない**（同じ run のログに
      # `-customBuildPath` は 1 度も出ない）。
      #
      # **環境変数でも動かせない** —— game-ci がコンテナへ渡す環境変数は
      # 固定一覧で、任意の名前は届かない（このリポジトリは
      # `ocvu-expect-all-platforms` をファイルにした時点で実測している）。
      #
      # **だから動かさず、出来た場所を読む。** 3 つの step が同じ値を
      # 見るので、ここ 1 箇所に持つ。
      OCVU_WEB_PLAYER_DIR: tests/UnityProject/build/web-player

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the Unity version
        id: unity
        shell: pwsh
        run: |
          $file = 'tests/UnityProject/ProjectSettings/ProjectVersion.txt'
          $m = Select-String -LiteralPath $file -Pattern '^m_EditorVersion:\s*(\S+)' |
               Select-Object -First 1
          if (-not $m) { Write-Error "could not read m_EditorVersion from $file"; exit 1 }
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      # 全 platform 分の plugin を重ねる。**Web だけでは gating の形が
      # 配る物と違う**ので、上の unity job と同じ材料を使う。
      - name: Download every plugin
        uses: actions/download-artifact@v8
        with:
          # **名前は unity-plugin-<platform> である**（上の plugin job が
          # そう upload している）。`plugin-*` では 1 つも当たらない ——
          # minimatch は前方一致しない（M6 の再レビューが実測）。
          pattern: unity-plugin-*
          path: other-plugins

      - name: Assemble the plugins
        shell: pwsh
        run: |
          # **artifact の中身は直下である**（upload の path が
          # `.../Runtime/Plugins` なので、その中身が展開される）。
          #
          # **linux-x64 は入れない。** `plugin` job の matrix は
          # windows / macos / android / ios / web の **5 つ**で、
          # **Linux は `unity` job がコンテナの中で自前にビルドする。**
          # 足すと `other-plugins/unity-plugin-linux-x64` が無くて
          # assemble が落ちる（M6 の 3 回目のレビューが実測）。
          # **`unity` job の一覧と同じにするのが正しい。**
          #
          # **この job は PluginGatingTests を走らせない**ので、他 platform を
          # 重ねる必要は本来無い。**それでも重ねるのは、Player に入る
          # plugin の集合を配る物と同じにするため**である。
          $sources = @('windows-x64', 'macos-arm64', 'android-arm64', 'ios-arm64', 'web-wasm') |
                     ForEach-Object { "other-plugins/unity-plugin-$_" }
          ./tools/assemble-plugins.ps1 -Source ($sources -join ';')

      # **WebGL の Player を建てる。** webgl のイメージが要る
      # （base では WebGL のビルドができない）。
      - name: Build the WebGL player
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tests/UnityProject
          unityVersion: ${{ steps.unity.outputs.version }}
          targetPlatform: WebGL
          buildMethod: BuildPlayer.BuildWebGL
          customImage: unityci/editor:ubuntu-${{ steps.unity.outputs.version }}-webgl-3
          allowDirtyBuild: true
          # **`buildsPath` / `buildName` は渡さない。**
          #
          # 以前は渡していたが、**`buildMethod` を指定した場合はどこにも
          # 効かない**（game-ci が `-customBuildPath` を渡すのは自前の
          # build method に対してだけである）。**渡っているように読める
          # 入力を置いておくほうが、無いより悪い** —— 出力先はここで
          # 決まっていると読めてしまう。
          #
          # 実際の出力先は job の `OCVU_WEB_PLAYER_DIR` にある。

      # **コンテナは root で書く。以降の step は runner の UID で動く。**
      #
      # そのままだと `build/` の下に 1 バイトも書けない。2026-09-03 に実測:
      #
      #     New-Item: Access to the path '.../build/web-e2e' is denied.
      #
      # **読むのは通るので、気づくのは書こうとした瞬間である** ——
      # 版ファイルの照合（読むだけ）は緑のまま通り、その次で落ちた。
      #
      # 同じ形の対応がこのファイルの `unity` job にもある（あちらは
      # OpenCV をコンテナでビルドした後）。
      - name: Take ownership of what the container wrote
        run: |
          set -euo pipefail
          for d in build tests/UnityProject/build; do
            # **無い物を chown して落とさない。** ただし `|| true` で
            # 全部を握り潰しはしない —— 在るのに失敗したなら、それは
            # 次の step が読めない理由そのものである。
            if [ -d "$d" ]; then sudo chown -R "$(id -u):$(id -g)" "$d"; fi
          done

      # **chromium を毎回落とさない。** 150 MB を毎 run で取ると遅いうえ、
      # 上流の帯域にも当たる（M6 の 3 回目のレビューの指摘）。
      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.49.1-${{ runner.os }}

      # **対応表を Unity の実物と突き合わせる。**
      #
      # `dev.ps1 test-unity-web` にも配線してあるが、**そのレーンはどの
      # workflow からも走らない**（M6 の再レビューの指摘）。
      # **完了条件 1 は「CI で不一致を検出する」**なので、ここで走らせる。
      #
      # **この job には WebGL 支援が入った Unity が必ず在る**（無ければ
      # 上の Player ビルドが先に落ちる）ので、「道具が無いから飛ばす」
      # 経路が構造的に生まれない。
      - name: Assert the Emscripten version matches the table
        shell: pwsh
        run: ./tools/assert-emscripten-version.ps1 -RecordedVersionPath "$env:OCVU_WEB_PLAYER_DIR/emscripten-version.txt"

      # **ローカルと同じ script を通す。** 起動の仕方は分かれてよいが、
      # 判定は分けない（CLAUDE.md の不変条件）。
      - name: Drive the player in a browser
        shell: pwsh
        run: ./tools/run-web-e2e.ps1 -PlayerDir "$env:OCVU_WEB_PLAYER_DIR"

      - name: Upload the player and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-web-e2e
          path: |
            ${{ env.OCVU_WEB_PLAYER_DIR }}
            build/web-e2e
          if-no-files-found: warn
