name: ci-unity

# L4（Unity EditMode）と L5（IL2CPP Player）を CI で実行する。
# M2 完了条件 7 がこの workflow の実行そのものを求めている。
#
# ## なぜ ubuntu で、なぜ game-ci なのか
#
# ローカルのレーンは Windows で `tools/dev.ps1` が Unity を直接起動する。
# CI で同じ形にするには runner に Unity を入れる必要があるが、GitHub ホストの
# `windows-2022` に Unity は含まれない。
#
# Unity を CI で動かす標準的な方法は game-ci である。**ただし game-ci の
# Windows イメージは Windows Server 2019 向けで、`windows-2022` では
# 「container operating system does not match the host operating system」で
# 落ちる**（game-ci/unity-builder#542、game-ci/docker#213）。`windows-2019` は
# GitHub 側で提供が終わっている。したがって Windows ホストでこの道は無い。
#
# game-ci が主として支えるのは Linux なので、このレーンは ubuntu で走らせる。
# 帰結として **L5 は Windows ではなく Linux の IL2CPP Player になる。**
# L5 が捕まえたいのは managed code stripping が P/Invoke 宣言を消す問題で、
# これは IL2CPP 全体の性質であり Windows 固有ではない。Windows の IL2CPP
# Player はローカルのレーン（`dev.ps1 test-unity-player`）が引き続き担う。
#
# ## 「CI はローカルと同一のコマンドを呼ぶ」との関係
#
# この workflow は `tools/dev.ps1` で Unity を起動しない。game-ci の action が
# 起動する。不変条件との食い違いなので、隠さず書く。
#
# 代わりに **合否の判定は `tools/assert-unity-results.ps1` に出し、ローカルと
# CI の両方がそれを通る。** 起動の仕方が分かれても、判定が分かれなければ
# 「ローカルで赤いものが CI で緑になる」は起きない。とくに「0 件で緑にしない」
# はこの script が持っており、両方に効く。
#
# native plugin のビルドと OpenCV の取得は従来どおり `dev.ps1` / `opencv.ps1`
# を呼ぶ。ここは分けていない。

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write   # game-ci が結果を check run として出す

# 同じコミットに対して push と pull_request の両方が走らないようにする。
#
# 以前は group に github.ref を使っていたが、これは push ではブランチ名
# （refs/heads/foo）、pull_request では PR の参照（refs/pull/N/merge）になるため、
# **同じコミットでも別グループと見なされて重複排除が効かなかった**。実測: 2026-08-27 に
# 6cfc31d へ 37 秒差で 2 本走り、後発が資源の奪い合いで落ちた（先発は成功）。
#
# head_ref は pull_request のときだけソースブランチ名になり、push では空になる。
# ref との組み合わせで、PR がある間は PR 側の 1 本に寄る。
concurrency:
  group: ci-unity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unity:
    name: Unity ${{ matrix.lane }} (Linux)
    runs-on: ubuntu-24.04
    # **native plugin は Unity が動くコンテナと同じ世代でビルドする。**
    #
    # runner（ubuntu-24.04, glibc 2.39）でビルドした .so は、game-ci の
    # コンテナ（より古い glibc）では読み込めない。v0.1.0 で実際にこれで
    # DllNotFoundException になった。ubuntu:22.04 で作れば、game-ci の
    # コンテナでも利用者の環境でも読み込める。
    #
    # game-ci の action は docker を使うので、この job 自体はコンテナに
    # 入れない——入れると docker in docker になる。plugin のビルドだけを
    # コンテナで行う（下の「Build the native plugin」を参照）。
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # L4: Mono の Editor 上で走る。IL2CPP は要らないので base で足りる。
          - lane: EditMode
            testMode: EditMode
            imageFlavour: base
          # L5: 実際に IL2CPP Player をビルドして、その上で走らせる。
          # scripting backend と stripping level は ProjectSettings に
          # コミットしてあるので（scriptingBackend.Standalone: 1、
          # managedStrippingLevel.Standalone: 2）、ここで設定する必要はない。
          - lane: Standalone
            testMode: Standalone
            # Linux の IL2CPP Player を作るので、その道具が入ったイメージが要る。
            # base では IL2CPP のビルドができない。
            imageFlavour: linux-il2cpp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # **Unity のバージョンを workflow に直書きしない。** 直書きすると
      # ProjectVersion.txt と二重管理になり、片方だけ上げたときに気づけない
      # （このリポジトリが繰り返している「2 箇所に同じ事実を書く」欠陥）。
      # game-ci に渡すイメージ名もここから組み立てる。
      - name: Resolve the Unity version
        id: unity
        shell: pwsh
        run: |
          $file = 'tests/UnityProject/ProjectSettings/ProjectVersion.txt'
          $m = Select-String -LiteralPath $file -Pattern '^m_EditorVersion:\s*(\S+)' |
               Select-Object -First 1
          if (-not $m) {
              Write-Error "could not read m_EditorVersion from $file"
              exit 1
          }
          $version = $m.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "image=unityci/editor:ubuntu-$version-${{ matrix.imageFlavour }}-3" >> $env:GITHUB_OUTPUT
          Write-Host "==> Unity $version / ubuntu-$version-${{ matrix.imageFlavour }}-3"

      # OpenCV の取得と native plugin のビルドは、**Unity が動くコンテナと
      # 同じ世代**で行う。runner（ubuntu-24.04, glibc 2.39）で作った .so は
      # game-ci のコンテナでは読み込めず、v0.1.0 で実際に
      # DllNotFoundException になった。
      #
      # job 自体をコンテナに入れないのは、game-ci の action が docker を
      # 使うためである（入れると docker in docker になる）。ビルドだけを
      # コンテナで走らせ、成果物はワークスペース経由で受け渡す。
      #
      # 使うイメージは tools/opencv-config.psd1 の
      # Toolchains['linux-x64'].Container と同じでなければならない。
      # 食い違うと構成ハッシュが指す artifact と別物ができる。
      - name: Build the native plugin in the build container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(grep -oP "Container\s*=\s*'\K[^']+" tools/opencv-config.psd1 | head -1)
          echo "==> building in $image"
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e GH_TOKEN \
            "$image" \
            bash -c 'bash ./tools/ci/setup-linux-container.sh \
                     && pwsh -NoProfile -File ./tools/opencv.ps1 restore \
                     && pwsh -NoProfile -File ./tools/dev.ps1 build'
          # コンテナは root で書くので、以降の step が読めるように直す。
          sudo chown -R "$(id -u):$(id -g)" \
            Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins build third_party || true

      # **支える予定より新しい環境を要求していないか。** ここで捕まえないと、
      # 失敗が Unity の DllNotFoundException として出て原因が 1 段遠くなる。
      - name: Verify the plugin's portability
        shell: pwsh
        run: ./tools/verify-plugin-portability.ps1

      # 置けたことを Unity より先に確かめる。plugin が無いまま Unity を
      # 走らせると、失敗が「テストが落ちた」ではなく「DllNotFoundException」
      # として出て、原因が 1 段遠くなる。
      - name: Check that the plugin and its import settings are in place
        shell: pwsh
        run: |
          $dir = 'Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins/Linux/x86_64'
          foreach ($f in @("$dir/libopencv_unity_native.so", "$dir/libopencv_unity_native.so.meta")) {
              if (-not (Test-Path -LiteralPath $f)) {
                  Write-Error "missing: $f"
                  exit 1
              }
              Write-Host "==> present: $f"
          }

      - name: Run ${{ matrix.lane }} tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tests/UnityProject
          unityVersion: ${{ steps.unity.outputs.version }}
          customImage: ${{ steps.unity.outputs.image }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/unity-${{ matrix.lane }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # 既定の checkName は lane 間で衝突するので分ける。
          checkName: ${{ matrix.lane }} results

      # **game-ci が緑でも、ここで独立に判定する。**
      #
      # 「0 件で緑にしない」はこのリポジトリの不変条件で、ローカルのレーンは
      # それを持っている。CI 側だけ持たないと、テストが全部消えたときに
      # ローカルは赤・CI は緑という最も紛らわしい状態になる。
      # ローカルと同じ script を通す。
      - name: Assert the results
        if: always()
        shell: pwsh
        run: |
          $xml = Get-ChildItem -Path 'artifacts/unity-${{ matrix.lane }}' -Filter '*.xml' -Recurse -File |
                 Select-Object -First 1
          if (-not $xml) {
              Write-Error 'no test result XML was produced under artifacts/unity-${{ matrix.lane }}'
              exit 1
          }
          ./tools/assert-unity-results.ps1 -ResultsPath $xml.FullName -Lane '${{ matrix.lane }}'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unity-${{ matrix.lane }}
          path: artifacts/unity-${{ matrix.lane }}
          if-no-files-found: warn
