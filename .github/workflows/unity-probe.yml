name: unity-probe

# **M4 の完了条件 6 と 7 を閉じるための探査。**
#
# どちらも「Linux 以外の runner で Unity を動かす」ことが本体で、
# **やってみるまで分からない**という理由で残っていた条件である。
#
#   条件 6: macOS の Plugin Import Settings を Unity で**実測する**。
#           macOS runner は iOS のクロスビルドで既に使っているが、
#           **Unity は一度も起動していない。** 全部入りの package には
#           macOS の .dylib と .meta が入って全利用者に届くのに、
#           それを読む Unity は Windows と Linux 上でしか動かしていない。
#
#   条件 7: windows-2022 上で game-ci/unity-test-runner へ**実際に投げ**、
#           その run の出力を根拠として、Windows の IL2CPP Player を CI で
#           回すかどうかを結論として書く。**やると決めるか諦めると決めるかは
#           問わない** —— roadmap が禁じているのは「上流の issue を読んだ
#           結果を根拠にする」ことである。2026-08-29 に、まさにその経路で
#           下した判断が崩れた（挙げていた 2 つの issue のうち 1 つは
#           使っていない別 action のもので、もう 1 つは別系統のものだった）。
#
# **この workflow が投げる版は、上の 5 回のときと違う。** 記録された結論は
# すべて `@v4` に対するもので、いまは ci-unity と同じ版（step のコメントに
# ある）を投げる。**もう一度探査するなら、結論を突き合わせる前にそこを見ること**
# —— `darwin-platform is not supported` のような「game-ci の対応範囲」に
# ついての結論は、実装が game-ci/cli へ移った版でも同じとは限らない。
#
# **workflow_dispatch のみ。** PR に費用を掛けない。結論が出たら、恒久レーンに
# するかを決める（決めるまでがこの探査の仕事である）。
#
# **落ちてよい。** 落ちた出力そのものが条件 7 の根拠になる。

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # gh run download に要る
  checks: write     # game-ci が check run を作る

concurrency:
  group: unity-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Unity on ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # **1 つが落ちてももう 1 つを走らせる。** 片方の結果しか無いと、
    # 条件 6 と 7 のどちらが閉じたのか分からなくなる。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # **macOS は game-ci を使わない。** 第 1 回の探査で
          # `Currently darwin-platform is not supported` が返った（run 33350726005）。
          # 道具の対応範囲の問題で、設定では回避できない。Unity Hub の CLI で
          # 直接入れて、ローカルのレーンと同じ経路（dev.ps1）で走らせる。
          - label: macOS
            runner: macos-14
            useGameCi: false
            testMode: EditMode
          # **Windows は Standalone（= IL2CPP Player）を投げる。**
          # 第 1 回で EditMode が 33 件通ったが、**EditMode が通ったことは
          # IL2CPP が通る根拠にならない** —— IL2CPP は別のモジュールを要求する。
          # 条件 7 が問うているのは IL2CPP Player の方である。
          # **Windows はこの回では回さない。** 第 2 回（run 33352025223）で
          # 結論が出た —— game-ci の Windows コンテナには IL2CPP が生成した
          # C++ をコンパイルする MSVC のツールチェーンが無く、Player build が
          # ToolchainNotFoundException で落ちる。**同じことを 2 度払わない。**

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the Unity version
        id: unity
        shell: pwsh
        run: |
          $file = 'tests/UnityProject/ProjectSettings/ProjectVersion.txt'
          $m = Select-String -LiteralPath $file -Pattern '^m_EditorVersion:\s*(\S+)' |
               Select-Object -First 1
          if (-not $m) {
              Write-Error "could not read m_EditorVersion from $file"
              exit 1
          }
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          Write-Host "==> Unity $($m.Matches[0].Groups[1].Value) on ${{ matrix.runner }}"

      - name: Install Ninja
        if: matrix.runner == 'macos-14'
        run: brew install ninja

      # 出力名は既存の workflow と揃える（config-hash）。**検査は path と key の
      # 両方がハッシュを参照し、参照先の step id が同じ job に在ることまで見る。**
      - name: Resolve OpenCV config hash
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "==> config hash $hash"

      - name: Cache OpenCV
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ runner.os }}-${{ steps.opencv-config.outputs.config-hash }}

      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore

      - name: Build the native plugin
        shell: pwsh
        run: ./tools/dev.ps1 build

      # **plugin と .meta が実際に置かれたことを見てから Unity を起動する。**
      # 置かれていないまま起動すると、Unity は「plugin が無い」で通り、
      # **何を測ったのか分からない緑**になる。
      - name: Check the plugin and its import settings are in place
        shell: pwsh
        run: |
          $root = 'Packages/com.ayutaz.opencv-unity-native/Runtime/Plugins'
          $found = @(Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue |
                     Where-Object { $_.Extension -ne '.meta' })
          if ($found.Count -lt 1) {
              Write-Error "native plugin が $root にありません。"
              exit 1
          }
          foreach ($f in $found) {
              $meta = "$($f.FullName).meta"
              if (-not (Test-Path -LiteralPath $meta)) {
                  Write-Error "import settings がありません: $meta"
                  exit 1
              }
              Write-Host "==> $($f.Name) と .meta が在る"
          }

      # **ここが本体。** customImage は渡さない —— あれは Linux の docker
      # イメージを指すもので、macOS / Windows では別の導入経路になる。
      # ---- macOS: game-ci を経由せず Unity Hub の CLI で入れる ----
      # **モジュールを足さない。** 第 2 回で `--module mac-il2cpp --childModules`
      # を付けたところ、**64 分かけても終わらず打ち切った**（run 33352025223）。
      # 条件 6 が要るのは「macOS の Unity が .dylib と .meta をどう扱うか」で、
      # **それは EditMode（Mono）で分かる。** IL2CPP のモジュールは要らない。
      #
      # **step に timeout を置く。** 前回は job の 90 分しか上限が無く、進捗も
      # 出していなかったので「進んでいるのか止まっているのか」が分からなかった。
      # **分からない待ちを作らない。**
      - name: Install Unity via Hub (macOS)
        if: matrix.useGameCi == false
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          brew install --cask unity-hub
          file=tests/UnityProject/ProjectSettings/ProjectVersion.txt
          version=$(sed -n 's/^m_EditorVersion: *//p' "$file")
          changeset=$(grep -o '([0-9a-f]*)' "$file" | head -1 | tr -d '()')
          echo "==> Unity $version ($changeset) を入れる"
          hub='/Applications/Unity Hub.app/Contents/MacOS/Unity Hub'
          # **失敗しても続ける。** 入らなかったこと自体が条件 6 の根拠になる。
          # **--architecture を渡す。** 渡さないと Hub は
          #   ? Please select preferred architecture:  Apple silicon / Intel
          # を出して**入力を待ち続ける**。--headless なのに対話する。
          # 第 2 回は 64 分、第 3 回は 25 分の上限まで無反応だった
          # （run 33352025223 / 33356182306）。**遅いのではなく止まっていた。**
          #
          # **stdin を閉じる。** 他にプロンプトが出たときも待たずに落ちるように
          # する —— CI で対話を待つのは、いつまでも終わらないのと同じである。
          "$hub" -- --headless install --version "$version" --changeset "$changeset" --architecture arm64 < /dev/null 2>&1 |
            while IFS= read -r line; do echo "[hub] $line"; done
          echo "==> Hub の install が終わった"
          ls -la "/Applications/Unity/Hub/Editor/$version/Unity.app/Contents/MacOS/" 2>&1 || \
            echo '==> Editor が入っていない'

      - name: Activate and run EditMode (macOS)
        if: matrix.useGameCi == false
        timeout-minutes: 25
        id: mac-tests
        continue-on-error: true
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -uo pipefail
          file=tests/UnityProject/ProjectSettings/ProjectVersion.txt
          version=$(sed -n 's/^m_EditorVersion: *//p' "$file")
          editor="/Applications/Unity/Hub/Editor/$version/Unity.app/Contents/MacOS/Unity"
          if [ ! -x "$editor" ]; then
            echo '==> Unity Editor が入らなかった。ここで終える。'
            exit 1
          fi
          mkdir -p artifacts/unity-probe-macOS
          # **ULF を置く。** `-username` / `-password` による認証は
          # `Found 0 entitlement groups and 0 free entitlements` で失敗した
          # （run 33358384921）。Linux のレーンが実際に使っているのは
          # UNITY_LICENSE（.ulf の中身）なので、こちらも同じものを置いてみる。
          #
          # **値は絶対に表示しない。** tee の出力を捨て、set -x もしない。
          if [ -n "${UNITY_LICENSE:-}" ]; then
            sudo mkdir -p /Library/Unity
            printf "%s" "$UNITY_LICENSE" | sudo tee /Library/Unity/Unity_lic.ulf > /dev/null
            echo "==> ULF を /Library/Unity/Unity_lic.ulf に置いた（$(sudo stat -f%z /Library/Unity/Unity_lic.ulf) バイト）"
          else
            echo "==> UNITY_LICENSE が空。認証できない見込み。"
          fi
          # -quit は付けない（-runTests は自分で終了する。付けるとテスト前に落ちる）
          "$editor" -batchmode -nographics -projectPath tests/UnityProject \
            -runTests -testPlatform EditMode \
            -testResults "$PWD/artifacts/unity-probe-macOS/results.xml" \
            -logFile artifacts/unity-probe-macOS/editmode.log
          echo "==> Unity の終了コード: $?"

      - name: Show the macOS log tail
        if: always() && matrix.useGameCi == false
        shell: bash
        run: |
          for f in artifacts/unity-probe-macOS/*.log; do
            [ -f "$f" ] || continue
            echo "---------- $f（末尾 40 行）"
            tail -40 "$f"
          done

      # ---- Windows: game-ci に投げる ----
      - name: Run ${{ matrix.testMode }} tests on ${{ matrix.label }}
        if: matrix.useGameCi
        id: tests
        continue-on-error: true
        # ci-unity と同じ版に揃える（理由はあちらのコメントにある）。
        # **過去の 5 回の実行は `@v4` で行った** —— roadmap に記録した
        # 結論はその run のものなので、そちらの `@v4` は直さない
        # （記録は当時の版を名乗るのが正しい）。
        uses: game-ci/unity-test-runner@f7d28f891263d875d47ef34370e9e8dd6087e1ef # v5.0.0-beta.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tests/UnityProject
          unityVersion: ${{ steps.unity.outputs.version }}
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/unity-probe-${{ matrix.label }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: probe ${{ matrix.label }} results

      # **game-ci の成否と、テストの中身の判定を分ける。**
      # game-ci が起動に失敗した場合と、起動したがテストが落ちた場合は
      # 別の結論に繋がる（前者は条件 7 の「諦める」根拠になりうるが、
      # 後者は実装の欠陥である）。
      - name: Report what happened
        if: always()
        shell: pwsh
        run: |
          Write-Host "==> game-ci の結果: ${{ steps.tests.outcome }} / macOS の結果: ${{ steps.mac-tests.outcome }}"
          $dir = 'artifacts/unity-probe-${{ matrix.label }}'
          if (-not (Test-Path -LiteralPath $dir)) {
              Write-Host "==> 結果ディレクトリが無い（Unity が起動しなかった可能性）"
              exit 0
          }
          $xml = @(Get-ChildItem -LiteralPath $dir -Filter '*.xml' -Recurse -File)
          if ($xml.Count -lt 1) {
              Write-Host "==> 結果 XML が無い（Unity は起動したがテストが走っていない可能性）"
              exit 0
          }
          ./tools/assert-unity-results.ps1 -ResultsPath $xml[0].FullName -Lane '${{ matrix.label }}'

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unity-probe-${{ matrix.label }}
          path: artifacts/unity-probe-${{ matrix.label }}
          if-no-files-found: warn
