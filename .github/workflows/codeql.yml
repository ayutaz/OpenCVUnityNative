name: codeql

# C++ と C# を CodeQL に読ませる。public repository なので無料である。
#
# **なぜ要るか。** このプロジェクトの危険な層は FFI 境界で、そこは
# 「即座には落ちず、後から無関係な場所が壊れる」欠陥が出る場所である。
# M2 で実際に整数の桁あふれによる境界検査の抜けを踏み、M3 では handle table の
# use-after-free を踏んだ。どちらも**書いた本人には見えず、CI の緑を素通り
# した**（後者は 1 度だけ落ちたテストから辿った）。
#
# CodeQL は sanitizer とは別の見方をする。sanitizer は「実際に踏んだ経路」を
# 見るが、CodeQL は経路を実行せずに探す。テストが通らない経路の欠陥は
# sanitizer には見えない。
#
# **これは L1/L2/L3 の代わりではない。** 重なっていないので、どちらかで
# 他方を代替できない。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 週 1 回。CodeQL のクエリ自体が更新されるので、コードが変わらなくても
    # 新しい指摘が出ることがある。
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # 結果を Security タブへ出すのに要る

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
          - language: csharp

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 読む範囲を自分が責任を持つコードに絞る。理由は設定ファイルにある
          # （build/ に FetchContent の GoogleTest が入り、他人のコードの
          # 指摘で本物が埋もれるため）。
          config-file: ./.github/codeql/codeql-config.yml
          # security-and-quality は既定より広い。誤検出も増えるが、
          # **この層は静かに壊れるので広く見る側に倒す。**
          queries: security-and-quality

      # C++ は実際にビルドしないと解析できない。OpenCV の取得と native の
      # ビルドは通常のレーンと同じ入口（opencv.ps1 / dev.ps1）を通す。
      #
      # Linux のビルドは ubuntu:22.04 のコンテナで行うのが本筋だが、CodeQL の
      # action は job のコンテナ内で動かせない（自前の runner 外部を使う）ので、
      # ここは runner 上で直接ビルドする。**解析が目的で、ここで作った .so は
      # 配らない**ので、glibc の要求が上がっても害は無い。
      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install Ninja
        if: matrix.language == 'c-cpp'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      # **OpenCV は毎回 API から取らない。** restore は木が既に在れば
      # download を丸ごと省く（Invoke-Restore の先頭で検証して return する）。
      #
      # キャッシュが無いと、この job が走るたびに artifact を探す API 呼び出しが
      # 発生する。**多数の workflow を同時に走らせるとレート制限に当たり、
      # 成果物にもコードにも問題が無いのに CI が全部赤くなる**（実測、
      # 2026-08-29。Dependabot の PR 9 件と v0.1.1 のリリースが同時に落ちた）。
      #
      # **この 2 step は c-cpp の leg だけで走らせる。** 条件は下の
      # `Restore OpenCV` と揃っていなければならない。csharp の leg は
      # OpenCV を一度も開かないので、揃っていないと 2 つの形で害が出る:
      # cache hit のときは **使わない 91 MB 前後の Linux ツリーを download
      # して展開する**し、cache miss のときは post step が
      # `Path Validation Error: Path(s) specified in the action for caching
      # do(es) not exist` を出して何も保存しない。後者が厄介で、
      # **「なぜ cache が温まらないのか」を調べる人が偽の手がかりを掴む**
      # ——実際には c-cpp 側の cache は正しく効いている。
      - name: Resolve OpenCV config hash
        if: matrix.language == 'c-cpp'
        id: opencv-config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $hash = Get-OpenCvConfigHash -Config (Get-OpenCvConfig)
          "config-hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache OpenCV
        if: matrix.language == 'c-cpp'
        uses: actions/cache@v6
        with:
          path: third_party/opencv/${{ steps.opencv-config.outputs.config-hash }}
          key: opencv-${{ steps.opencv-config.outputs.config-hash }}

      - name: Restore OpenCV
        if: matrix.language == 'c-cpp'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore

      # **配布するライブラリだけをビルドする。**
      #
      # CodeQL の C++ 解析は「実際にコンパイルされたもの」を見る。つまり
      # **`paths-ignore` は C++ には効かない**——設定で除外しても、
      # コンパイルされていれば解析対象に入る（実測: build/ を ignore に
      # 書いても GoogleTest の指摘 5 件が消えなかった）。
      #
      # `dev.ps1 build` はテストも含めて全部ビルドするので、FetchContent が
      # 落としてくる GoogleTest がコンパイルされ、その指摘が出ていた。
      # **他人のコードの指摘は直せない。直せないものが並ぶと本物が埋もれる。**
      #
      # 配布する `opencv_unity_native` だけを作れば、native/src の全ソースは
      # 解析されつつ GoogleTest は入らない。テスト側（native/tests）は
      # 解析されなくなるが、そこは配らないコードで、意図的に落ちる
      # プローブを含む——critical として毎回報告される種類のものである。
      - name: Build the shipped library only
        if: matrix.language == 'c-cpp'
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $root = Get-OpenCvRoot -Config (Get-OpenCvConfig)
          $preset = "$(Get-OpenCvPlatform)-debug"
          cmake --preset $preset "-DOCVU_OPENCV_ROOT=$root"
          cmake --build --preset $preset --target opencv_unity_native

      - name: Build managed
        if: matrix.language == 'csharp'
        run: dotnet build tests/Managed/CvUnity.Tests.Managed/CvUnity.Tests.Managed.csproj -c Debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
