name: release

# tag を打つと 3 platform 分の配布物を作って GitHub Release に上げる。
#
# **なぜ Release で配るか。** native plugin の binary は git の追跡から外して
# ある（`.gitignore`）。追跡すると 3 platform 分を毎ビルドコミットすることになり、
# 履歴が永久に膨らむ。しかしそのままでは Git URL で参照した利用者に `.meta` しか
# 届かず、UPM として導入しても中身が無い（M3 のレビュー H1）。
#
# tarball を Release asset として配れば、binary を履歴に入れずに「導入できる」を
# 成立させられる。利用者は Release の URL を UPM に渡す。
#
# workflow_dispatch も残す。tag を打つ前に成果物の中身を確認できる方が、
# 「出してから気づく」より安い。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # Release の作成に要る
  actions: read     # gh run download に要る

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Linux はコンテナの中でビルドする。**runner のイメージで直接ビルドしない。**
    #
    # 共有ライブラリはビルドした環境と同じかそれより新しい glibc でしか
    # 読み込めない。runner のイメージは GitHub の都合で上がっていくので、
    # 上がるたびに成果物の要求が上がる。v0.1.0 で実際に踏んだ（ubuntu-24.04 で
    # 作った .so が GLIBC_2.38 を要求し、より古い環境で DllNotFoundException）。
    #
    # イメージ名の正本は tools/opencv-config.psd1 の
    # Toolchains['linux-x64'].Container で、その値は構成ハッシュに入る。
    # ここと食い違うと tools/tests/OpenCvConfig.Tests.ps1 が落ちる。
    container: ${{ matrix.platform == 'linux-x64' && 'ubuntu:22.04' || '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false   # 1 platform の失敗で他を巻き込まない
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-24.04

    steps:
      # **git だけを checkout より前に入れる。**
      #
      # checkout は git が無いと REST API でアーカイブを落とす形に落ち、
      # .git の無いツリーになる。すると `git ls-files` を使うテストが
      # 「追跡ファイル 0 件」で通ってしまう——検査が黙って無力化される形である。
      #
      # 残りの道具は checkout の**後**に setup-linux-container.sh が入れる。
      # そのスクリプト自体がリポジトリの中にあるので、順序はこうなる
      # （最初はスクリプトを checkout 前に置いてしまい、`not found` で落ちた）。
      - name: Install git before checkout
        if: matrix.platform == 'linux-x64'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - name: Set up the build container
        if: matrix.platform == 'linux-x64'
        run: bash ./tools/ci/setup-linux-container.sh

      # Linux はコンテナのセットアップで入るので macOS だけ。
      - name: Install Ninja
        if: matrix.platform == 'macos-arm64'
        shell: pwsh
        run: brew install ninja

      - name: Restore OpenCV
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/opencv.ps1 restore

      # plugin binary をこの platform 向けにビルドする。package-release.ps1 は
      # Packages/ 配下に置かれた binary を checksums に入れるので、先に要る。
      - name: Build the native plugin
        shell: pwsh
        run: ./tools/dev.ps1 build

      # 成果物が構成の意図どおりかを、配る前に確かめる。ここを通っていない
      # binary は配布しない。
      - name: Verify the artifact linkage
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $root = Get-OpenCvRoot -Config (Get-OpenCvConfig)
          ./tools/verify-artifact-linkage.ps1 -Root $root

      - name: Build the release bundle
        shell: pwsh
        run: ./tools/package-release.ps1 -OutputDir release-out

      # UPM が導入できる形にまとめる。package.json のあるディレクトリが
      # tarball の root に来る必要がある（npm pack と同じ構造）。
      # tools/dev.ps1 test-unity-tarball が使うのと同じ script で作る。
      # ここを別に書くと、ローカルで「Unity に導入できた」と確かめた tarball と、
      # 実際に配る tarball が別物になる。
      #
      # 以前はこの step が直接 `tar -czf $name -C Packages <id>` を叩いていた。
      # その形の tarball は UPM が導入できない — 展開後の root に package.json
      # が来ないため、"The file [<tmp>\package.json] cannot be found" で失敗する。
      # test-unity-tarball レーンを足して初めて分かった（Unity 6000.0.82f1 で実測）。
      - name: Create the UPM tarball
        shell: pwsh
        run: ./tools/pack-upm-tarball.ps1 -OutputDir upm-out -Platform '${{ matrix.platform }}'

      - name: Upload the platform bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            upm-out/
            release-out/
          if-no-files-found: error

  publish:
    name: Publish the release
    runs-on: ubuntu-24.04
    needs: package
    timeout-minutes: 15
    # tag を打ったときだけ公開する。workflow_dispatch は成果物の確認用なので、
    # Release は作らない（誤って空の Release を作らないため）。
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Download every platform bundle
        uses: actions/download-artifact@v8
        with:
          path: bundles

      # 3 platform 分が揃っていることを確かめてから公開する。1 つでも欠けた
      # Release を出すと、利用者はその platform だけ導入できない状態になる。
      # fail-fast: false にしてあるぶん、ここで数えないと欠けたまま出る。
      - name: Check that all three platforms are present
        shell: pwsh
        run: |
          $expected = @('windows-x64', 'macos-arm64', 'linux-x64')
          $missing = @($expected | Where-Object {
              -not (Test-Path "bundles/release-$_")
          })
          if ($missing.Count -gt 0) {
              Write-Error "missing platform bundle(s): $($missing -join ', ')"
              exit 1
          }
          Write-Host "==> all three platform bundles are present"

      # Release asset の名前は Release 全体で一意でなければならない。
      # package-release.ps1 は 3 platform とも同じ名前
      # （checksums.txt / sbom.spdx.json / build-manifest.json /
      # THIRD_PARTY_NOTICES.md）で出すので、そのまま渡すと衝突する。
      # platform 名を頭に付けてから上げる。tarball は
      # pack-upm-tarball.ps1 が既に platform 名を含めているのでそのまま。
      - name: Stage the assets under unique names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          foreach ($dir in Get-ChildItem bundles -Directory) {
              $platform = $dir.Name -replace '^release-', ''
              foreach ($f in Get-ChildItem $dir.FullName -Recurse -File) {
                  $name = if ($f.Extension -eq '.tgz') {
                      $f.Name
                  } else {
                      "$platform-$($f.Name)"
                  }
                  Copy-Item -LiteralPath $f.FullName -Destination (Join-Path 'assets' $name) -Force
              }
          }

          # 名前が衝突していたら、Copy-Item が黙って上書きした後になる。
          # 数えて確かめる: 3 platform x (tarball 1 + 配布物 4) = 15。
          $staged = @(Get-ChildItem assets -File)
          Write-Host "==> staged $($staged.Count) assets"
          $staged | ForEach-Object { Write-Host "    $($_.Name)" }
          if ($staged.Count -ne 15) {
              Write-Error "expected 15 assets (3 platforms x 5 files) but staged $($staged.Count); names collided or a file is missing"
              exit 1
          }

          <#
              **配る物そのもののチェックサムを出す。**

              package-release.ps1 が出す checksums.txt は package の中身
              （native plugin）を対象にしており、**tarball 自体は含まない**。
              つまり利用者は .tgz をダウンロードしても、展開するまで完全性を
              確認できない。ダウンロードした物を検証できないなら、
              チェックサムを配る意味が半分になる。

              Release の全 asset を 1 つの SHA256SUMS.txt にまとめる。
              sha256sum / shasum -a 256 -c がそのまま食える形式にするので、
              利用者は Release ページから 2 つ落として 1 コマンドで検証できる。

              自分自身は含めない（含めると内容が確定しない）。
          #>
          $sums = $staged |
              Sort-Object Name |
              ForEach-Object {
                  $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
                  "$hash  $($_.Name)"
              }
          # **改行は LF を明示する。** Set-Content は Windows で CRLF を書き、
          # sha256sum -c はファイル名の末尾に付いた CR をファイル名の一部として
          # 扱うので、15 件すべてが "No such file or directory" になる
          # （実測。生成物は 15 行あり、workflow の行数検査も通るのに、
          # 利用者が使う道具では 1 件も検証できない状態だった）。
          [IO.File]::WriteAllText(
              (Join-Path $PWD 'assets/SHA256SUMS.txt'),
              (($sums -join "`n") + "`n"))

          # 15 行きっかりであること。1 行でも欠けたら、その asset は検証でき
          # ないまま配られる。
          $written = @(Get-Content -LiteralPath 'assets/SHA256SUMS.txt' |
                       Where-Object { $_.Trim() -ne '' })
          if ($written.Count -ne $staged.Count) {
              Write-Error "SHA256SUMS.txt has $($written.Count) lines but there are $($staged.Count) assets"
              exit 1
          }
          Write-Host "==> SHA256SUMS.txt covers $($written.Count) assets"

      # **下書きとして作る。公開は人が押す。**
      #
      # tag を打った時点で外に出てしまうと、中身が違っていたときに
      # 「消す」しかない——しかも消しても、その間に取得した人には届いた
      # あとである。下書きなら、実物が GitHub 上に揃った状態で目で見て
      # から公開できる。
      #
      # この workflow は M3 完了時点で workflow_dispatch の空撃ち
      # （package job だけ）しか実績が無く、publish job は一度も動いて
      # いない。初回は特に、機械の判定と人の目の両方を通す価値がある。
      #
      # 公開したくなったら Release ページの「Publish release」を押す。
      # --draft を外す判断は、この workflow が何度か通って形が安定して
      # からでよい。
      - name: Publish as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # **ノートはファイルから読む。**
          #
          # 以前は --notes に長い文字列を直接書いていた。PowerShell の
          # 二重引用符では バックスラッシュ n は改行にならない（改行は
          # バッククォート n である）ので、Markdown のつもりで書いた改行が
          # そのまま文字として Release ページに出る。YAML の中の PowerShell の
          # 中の Markdown という三重のエスケープを人が正しく保つのは難しく、
          # 間違えても CI は緑のまま通る（gh は文字列を受け取っただけで成功する）。
          #
          # .github/release-notes.md に出すと、差分で読めて、
          # エスケープが 1 段も要らなくなる。
          $assets = @(Get-ChildItem assets -File)
          gh release create ${{ github.ref_name }} `
              --draft `
              --title ${{ github.ref_name }} `
              --notes-file .github/release-notes.md `
              @($assets | ForEach-Object { $_.FullName })
