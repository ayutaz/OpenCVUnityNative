name: build-opencv

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/opencv-config.psd1'
      - 'tools/OpenCvConfig.psm1'
      - 'tools/opencv.ps1'
      - 'tools/verify-opencv-artifact.ps1'
      - '.github/workflows/build-opencv.yml'

concurrency:
  group: build-opencv-${{ github.ref }}
  cancel-in-progress: false

# 既定の権限は広い。artifact の公開に要るのは書き込みだけで、
# それ以外は読み取りで足りる。**必要な分だけ渡す。**
permissions:
  contents: read
  actions: write   # artifact の公開に要る

jobs:
  build:
    name: OpenCV 5.0.0 ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Linux はコンテナの中でビルドする。**runner のイメージで直接ビルドしない。**
    #
    # 共有ライブラリはビルドした環境と同じかそれより新しい glibc でしか
    # 読み込めない。runner のイメージは GitHub の都合で上がっていくので、
    # 上がるたびに成果物の要求が上がる。v0.1.0 で実際に踏んだ（ubuntu-24.04 で
    # 作った .so が GLIBC_2.38 を要求し、より古い環境で DllNotFoundException）。
    #
    # イメージ名の正本は tools/opencv-config.psd1 の
    # Toolchains['linux-x64'].Container で、その値は構成ハッシュに入る。
    # ここと食い違うと tools/tests/OpenCvConfig.Tests.ps1 が落ちる。
    container: ${{ matrix.platform == 'linux-x64' && 'ubuntu:22.04' || '' }}
    # CI 実測（Windows、clone〜verify まで通しで）は 4 分 09 秒（run 32849957498）。
    # macOS / Linux での実測はまだ無い。cold runner やネットワークの変動、
    # 将来の module 追加を見込んで大きめに取っている — 実測の何倍、という
    # 根拠のある数字ではなく、安全側に振った目安であることに注意。
    timeout-minutes: 150
    strategy:
      fail-fast: false   # 1 platform の失敗で他を巻き込まない
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-24.04
          # モバイルは**クロスコンパイル**なので、host の OS は対象と一致しない。
          # Android は NDK が入っている ubuntu で、iOS は Xcode が要るので macOS で
          # ビルドする。**Linux のようにコンテナへは入れない** —— Android の .so は
          # NDK の sysroot に対してリンクするので、host の glibc は関係ない。
          - platform: android-arm64
            runner: ubuntu-24.04
          - platform: ios-arm64
            runner: macos-14

    steps:
      # **git だけを checkout より前に入れる。**
      #
      # checkout は git が無いと REST API でアーカイブを落とす形に落ち、
      # .git の無いツリーになる。すると `git ls-files` を使うテストが
      # 「追跡ファイル 0 件」で通ってしまう——検査が黙って無力化される形である。
      #
      # 残りの道具は checkout の**後**に setup-linux-container.sh が入れる。
      # そのスクリプト自体がリポジトリの中にあるので、順序はこうなる
      # （最初はスクリプトを checkout 前に置いてしまい、`not found` で落ちた）。
      - name: Install git before checkout
        if: matrix.platform == 'linux-x64'
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up the build container
        if: matrix.platform == 'linux-x64'
        run: bash ./tools/ci/setup-linux-container.sh

      # Ninja は macOS / Linux の generator。Windows は Visual Studio generator
      # を使うので不要。
      # Linux はコンテナのセットアップで入るので macOS だけ。
      - name: Install Ninja
        # macOS / iOS / Android の preset はすべて Ninja。**Windows だけが
        # Visual Studio generator で、Linux はコンテナ側で入る。**
        if: matrix.platform != 'windows-x64' && matrix.platform != 'linux-x64'
        # **brew は ubuntu に無い。** android-arm64 は ubuntu runner で
        # コンテナ外なので、setup-linux-container.sh も走らない。
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update && sudo apt-get install -y ninja-build
          fi

      - name: Resolve the configuration
        id: config
        shell: pwsh
        run: |
          Import-Module ./tools/OpenCvConfig.psm1 -Force
          $config = Get-OpenCvConfig -Platform '${{ matrix.platform }}'
          $name = Get-OpenCvArtifactName -Config $config
          $hash = Get-OpenCvConfigHash -Config $config
          "artifact-name=$name" >> $env:GITHUB_OUTPUT
          "config-hash=$hash"   >> $env:GITHUB_OUTPUT
          Write-Host "artifact: $name"

      # ローカルと同一のコマンドを呼ぶ。CI 専用の手順は作らない。
      - name: Build OpenCV
        shell: pwsh
        run: ./tools/opencv.ps1 build -Platform ${{ matrix.platform }}

      - name: Show the manifest
        shell: pwsh
        run: Get-Content "third_party/opencv/${{ steps.config.outputs.config-hash }}/build-manifest.json"

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.config.outputs.artifact-name }}
          path: third_party/opencv/${{ steps.config.outputs.config-hash }}/
          if-no-files-found: error
          # Actions artifact の上限。90 日を超えて保持することはできないため、
          # 期限切れ後は restore が明示的に失敗して再実行を促す（tools/opencv.ps1）。
          retention-days: 90
